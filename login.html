/* 20-movil.css */
/* ============ MÓVIL ============
   La app se diseñó en un portátil y en el móvil era el mismo diseño con las cajas
   más juntas: 1.176 objetivos táctiles por debajo de los 44 px que recomienda
   Apple, 1.097 textos por debajo de 11 px, y las fichas de Equipo cortadas.
   Medido en un iPhone 14 (390×844) el 06/09; los números están en el changelog.

   Lo que hay aquí, por orden: primero un fallo de maquetación que se cuela también
   en escritorio, luego los fundamentos (que algo se pueda tocar y leer), y al final
   la vista del profesional, que es la que usan los 22 del servicio todos los días. */

/* ---------- 1. LO QUE NO SABE ENCOGER (también en escritorio) ----------
   `.tchip i` lleva white-space:nowrap con puntos suspensivos. Visualmente recorta,
   pero el ancho MÍNIMO del elemento sigue siendo el del texto entero, y la chip de
   formación de un R5 son 105 caracteres: «QNO 3Q17 · QNO 3Q16 · QNO 3Q13 · CA.
   PRÓSTATA / ONCO/UROTELIO / UROONCOLOGÍA · QNO CIST/BIOP · QNO LITO/END». Como la
   rejilla de Equipo usa columnas 1fr (mínimo automático), esa chip estiraba la
   columna a 954 px y arrastraba a TODAS las fichas: en el móvil se veían cortadas
   por la mitad, sin los botones de acceso. Con min-width:0 los puntos suspensivos
   empiezan a hacer su trabajo de verdad. */
.tchip{min-width:0}
.tchip i{min-width:0}
.cards>*{min-width:0}
.pchead>span[data-ficha]{min-width:0}

@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  /* ---------- 2. QUE SE PUEDA TOCAR ----------
     44 px es la medida de un dedo. Se aplica a la altura, no al ancho: un botón
     puede ser estrecho, pero si es bajo se falla el toque. */
  .btn,.btn-mini,.btn-sec,.btn-ghost,.btn-cta,.mbtn,.segk,.cvchip,.austipo,.ptab,
  .achip,.aptall,.addabs,.rmbtn,.cvapply,.loginbtn{min-height:44px}
  .pmini,.festrm,.avx,.ovx,.vacx,.updx{min-width:40px;min-height:40px}
  .btn,.btn-sec,.btn-ghost,.btn-cta{padding:12px 16px;font-size:14px}
  .btn-mini{padding:11px 14px;font-size:13px}
  .mbtn{min-width:44px;padding:0 12px}
  input,select,textarea,.logininp{min-height:46px;font-size:16px}   /* 16px: por debajo, iOS hace zoom al enfocar */
  .aptchk,.singchk{min-height:38px}
  .bnav button{min-height:52px}

  /* ---------- 3. QUE SE PUEDA LEER ----------
     Nada por debajo de 11 px en la mano. Las etiquetas en versalitas (mono) eran
     de 8,5–9 px: legibles en un monitor a 60 cm, no en un móvil a pulso. */
  body{font-size:14px}
  .micro,.revgrp,.sechdr .micro,.accl,.persgrp,.cvn,.petbadge,.tchip b,.ps,.abschip,
  .avisoban .avmeta b,.avisoban .avnew,.avisoban .avpara{font-size:11px}
  .filltxt,.revsub,.cvpsub,.festvacio,.loginsub,.pchead small,.persnm small,
  .fics span,.statm{font-size:12px}
  .tchip,.tchip i,.aptchk,.singchk,.cvwho small,.festinfo small{font-size:12px}
  small{font-size:12px}

  /* ---------- 4. MENOS ADORNO, MÁS CONTENIDO ----------
     En una pantalla de 844 px de alto, cada 100 px de cabecera son un turno menos
     a la vista. */
  main{padding:12px calc(12px + env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  .card,.pcard,.ovcard{padding:14px}
  h1{font-size:22px;line-height:1.2}
  h2{font-size:17px}
  .dtit,.mestit{font-size:20px}
  .kpis,.mkpis{gap:8px}
  .sechdr{margin:14px 0 10px;gap:8px;flex-wrap:wrap}

  /* la guía de tres pasos ocupaba un tercio de la pantalla: se pliega */
  .guia{padding:12px 14px}
  .guia .gpaso{gap:10px}

  /* ---------- 5. LA VISTA DEL PROFESIONAL ----------
     Lo primero que ve al abrir tiene que ser SU TURNO, no su nombre en grande.
     Antes: logo, avatar de 130 px, nombre a 40 px, tres botones, cuatro KPI y el
     principio de un calendario vacío — la primera pantalla entera sin un solo dato
     de trabajo. */
  .perfilhero{gap:10px;margin:2px 0 12px;align-items:center}
  .perfilhero .fichav{width:44px !important;height:44px !important;font-size:15px !important;border-radius:12px}
  .perfilhero h1{font-size:19px !important;letter-spacing:-.3px}
  .perfilhero .loginsub{font-size:11.5px}
  /* los botones de la cabecera son de uso ocasional: al final, en una fila que cabe */
  .perfilhero .btn{order:5;flex:1 1 auto;min-width:0}
  .perfilhero #perfilVolverAdmin{order:-1;flex:1 1 100%}

  /* pestañas: se deslizan en una sola línea en vez de partirse en dos */
  /* eran un carrusel con la barra escondida y sin pista de que había más:
     «Bandeja» (los avisos) quedaba a 0 px visibles en un iPhone SE. Son cuatro
     fijas: dos filas de dos caben siempre. */
  .perfiltabs{flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0}
  .ptab{flex:1 1 calc(50% - 3px);padding:11px 8px;font-size:13px;text-align:center;justify-content:center}

  /* KPIs: cuatro cifras en dos filas de dos, sin huecos sueltos */
  .ficstats{display:grid !important;grid-template-columns:1fr 1fr;gap:8px}
  .fics{padding:10px 12px}
  .fics b{font-size:22px}

  /* EL ORDEN. Lo que abre un facultativo a las 7 de la mañana es «qué tengo hoy»,
     y eso estaba en tercer lugar, debajo del nombre, tres botones y cuatro ceros.
     En el móvil se le da la vuelta: primero los próximos días, luego el calendario
     del mes, y los totales al final — que son de consulta, no de urgencia.
     Se hace con `order`, sin tocar el HTML: la misma pantalla en el portátil. */
  [data-pcont="planilla"]{display:flex;flex-direction:column;gap:12px}
  [data-pcont="planilla"]>.ficstats{order:3}
  [data-pcont="planilla"]>.perfilcols{order:1;display:flex;flex-direction:column;gap:12px}
  [data-pcont="planilla"] .perfilcols>.card:nth-child(1){order:2}   /* tu mes de un vistazo */
  [data-pcont="planilla"] .perfilcols>.card:nth-child(2){order:1}   /* próximos días con actividad */

  /* los botones de la cabecera son de uso ocasional (imprimir, cuenta, salir): se
     bajan al final de la pantalla para no comerse la primera vista */
  .perfilhero{flex-wrap:wrap}
  .perfilhero .btn{order:9;font-size:13px;padding:10px 12px;min-height:44px}

  /* el calendario del mes: celdas que caben y que dicen algo */
  .ficcal{gap:3px}
  .ficd{min-height:46px;padding:3px 2px;border-radius:9px}
  .ficd .n{font-size:11px}
  .ficd{min-height:56px}
  /* dos líneas, pero partiendo solo por espacios: «ONCO/URO» entero cabe en 42 px
     a 8,5 px de mono; partirlo en «ONCO/UR|O» era peor que recortarlo */
  .ficd .c{font-size:11px;line-height:1.12;letter-spacing:-.25px;white-space:normal;overflow-wrap:normal;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- 6. REJILLAS ANCHAS ----------
     Mes, Semana y Actividad son matrices: en el móvil se desplazan de lado con la
     primera columna fija, en vez de encogerse hasta ser ilegibles. */
  .tscroll,.mscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .mgrid td:first-child,.mgrid th:first-child,.cvtab td:first-child,.cvtab th:first-child{position:sticky;left:0;z-index:2;background:var(--surface)}

  /* ---------- 7. DIÁLOGOS A PANTALLA COMPLETA ----------
     Un modal centrado con márgenes desperdicia la mitad del móvil. */
  .ovl{align-items:flex-end;padding:0}
  .ovcard{width:100%;max-width:none !important;max-height:92vh;border-radius:20px 20px 0 0;padding:18px calc(14px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  .ovx{top:12px;right:12px}
}

/* pantallas muy estrechas (iPhone SE y similares) */
@media (max-width:380px){
  .ficstats{grid-template-columns:1fr 1fr}
  .perfilhero h1{font-size:17px !important}
}

/* ---------- 8. LO QUE QUITA GENTE DE UN TURNO ----------
   Sin ratón no hay :hover que revele nada, así que la × de la ficha estaba
   siempre al 50 % de opacidad, medía 13×16 px y quedaba pegada al propio nombre
   (que abre la ficha). Dos acciones muy distintas a tres píxeles. Ahora la × es
   un objetivo de 44 px, se ve, y además se pregunta antes de quitar. */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .rmx{opacity:1;min-width:44px;min-height:44px;padding:0 10px;font-size:20px;color:var(--ink3);
    display:inline-flex;align-items:center;justify-content:center;margin:-8px -6px -8px 2px}
  .pchip{padding-right:2px}
  .festrm,.pmini,.avx,.ovx,.vacx,.updx{min-width:44px;min-height:44px}
  /* el ＋ de poner una ausencia en la rejilla del mes era de 19×19 */
  .pnaus{min-width:34px;min-height:34px;font-size:17px}
}

/* ---------- 9. FORMULARIOS QUE NO CABEN EN 320 px ----------
   Dos rejillas se salían de la pantalla y no era por el texto: era el ancho
   MÍNIMO de sus columnas.
   · Peticiones: `.perfilcols` usa columnas 1fr, cuyo suelo es el min-content del
     contenido. Dentro hay un <select> cuya opción más larga («Cambio de turno con
     un compañero») impone 390 px de mínimo, así que la tarjeta entera se salía
     82 px en un iPhone SE. Con minmax(0,1fr) la columna puede encoger y el select
     recorta como debe.
   · Vacaciones: la fila de alta baja a dos columnas de 150 px, que con el hueco
     suman 320 px justos y no caben en 296 px de ancho útil. Por debajo de 380 px
     pasa a una sola columna. */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .perfilcols{grid-template-columns:minmax(0,1fr)}
  .perfilcols>*,.pinlbl,.vacform>*{min-width:0}
  .pinlbl select,.pinlbl input,.vacform .logininp,select.logininp{width:100%;max-width:100%;box-sizing:border-box}
}
@media (max-width:380px){
  .vacform{grid-template-columns:1fr}
  .vacform .vacnota,.vacform .btn{grid-column:1/-1}
}

/* ---------- 10. SEMANA: LA COLUMNA FIJA SE COMÍA LA PANTALLA ----------
   `.act td.lbl` mide 250 px y es sticky; las columnas de día, 154 px de mínimo.
   En un móvil de 390 px eso deja 140 px para los siete días: se veía uno y medio,
   y al desplazar de lado las fichas de gente pasaban POR DEBAJO de la columna
   fija. Con 118 px de etiqueta y 92 px de día caben tres días enteros. */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .act td.lbl,.act th.lbl{min-width:118px;max-width:118px;padding:8px 8px;font-size:12.5px}
  .act td.lbl small{font-size:10.5px}
  .semt th{min-width:92px}
  .wacts{gap:4px;margin-top:5px}
  .wacts button{padding:7px 6px;font-size:11px;flex:1;min-height:34px}
  .wcell{gap:4px;min-height:44px}
  .wav{min-width:44px;height:44px;font-size:13px}
  .wadd,.wtg{min-width:44px;height:44px}

  /* ---------- 11. EL CALENDARIO DEL MES DEL PROFESIONAL ----------
     Siete columnas 1fr cuyo suelo es el min-content: la etiqueta de la actividad
     («MIR GUARDIA») no encoge y en 320 px la rejilla se salía 46 px. */
  .ficcal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .ficd,.ficdh,.ficd .c,.ficd .n{min-width:0}
}

/* ---------- 12. LO QUE LA CASCADA SE COMÍA ----------
   Tres reglas de este fichero perdían contra selectores más específicos de
   14-importador-aptitudes.css (.ovcard.big, 0,0,2,0) y no llegaban a aplicarse
   nunca (auditoría del 06/09):
   · el relleno del área segura en los diálogos grandes: 16 de los 22 diálogos
     acababan con su último botón sobre el indicador de inicio del iPhone;
   · el panel de Cobertura, que se pinta DENTRO de la página, heredaba
     max-height:94dvh + overflow:auto y se convertía en un scroll dentro de otro. */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .ovcard.big{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .ovcard.big.incard{max-height:none;overflow:visible;padding-bottom:16px}

  /* ---------- 13. MES: LA MISMA CURA QUE SEMANA ----------
     La columna fija de nombres medía 175 px y cada día 62: en un iPhone 14 se
     veían dos días, en un SE uno. Con 96 + 38 caben siete y cinco. */
  :root{--w-nombre:96px;--w-dia:38px}   /* 7 días a la vista en un iPhone 14 (antes 4,5) */
  .plan td.pname,.plan th.pname{padding:4px 6px}
  .pn b{font-size:12px}
  .plan th.day{min-width:var(--w-dia)}
  .plan th.day .dd{font-size:13.5px}
  .pill{min-width:32px;height:30px;font-size:11px;padding:0 2px}
  .plan th.day .dn{font-size:10px}
  .gb{font-size:8.5px}
  .plan td{padding:5px 2px}
}

/* ---------- 14. CABECERAS DE ADMIN: PRIMERO EL DATO ----------
   Fotografiado a 390 px el 06/09: en Mes, la primera pantalla entera eran cinco
   botones en tres filas y cuatro KPI de 250 px de alto — ni una celda de la
   rejilla a la vista. En Semana, 600 px de cabecera antes de la tabla.
   Ahora: una fila con las flechas y el título, una fila de acciones que se
   desliza de lado (como las pestañas del profesional), los cuatro KPI en cuatro
   líneas dentro de una tarjeta y la leyenda en una sola línea deslizable. En el
   portátil, las acciones van juntas a la derecha: con `display:contents` cada botón
   era hijo de `.dnav` y, al no caber, la segunda fila empezaba por la izquierda —
   unos botones a un lado y otros al otro. */
.dacts{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;margin-left:auto;min-width:0}
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .dnav{gap:8px 10px;margin-bottom:10px;align-items:center}
  .dnav .spacer{display:none}
  .dkick{display:none}
  .dbig,#sLabel,#dTitle{font-size:22px !important;line-height:1.15}
  .dnav>div[style*="min-width:0"]{flex:1 1 auto}
  .mlabel{min-width:0;flex:1;font-size:16px}
  .arrows{padding:2px}
  .mbtn{width:44px;height:44px}
  .dstats{flex:1 1 100%;order:3;gap:6px}
  .dstat{font-size:11px;padding:6px 9px}
  .dacts{display:flex;order:4;flex:1 1 100%;flex-wrap:nowrap;justify-content:flex-start;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:2px 12px 4px}
  .dacts::-webkit-scrollbar{display:none}
  .dacts .btn{flex:none;white-space:nowrap;padding:10px 13px;font-size:13px;min-height:44px}
  /* KPI: cuatro líneas, no cuatro tarjetas */
  .kpis{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden}
  .kpi{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border:0;border-radius:0;border-bottom:1px solid var(--border2)}
  .kpi:last-child{border-bottom:0}
  .kpi .micro{flex:1;font-size:11px}
  .knum{font-size:17px;margin:0}
  .kcap{display:none}
  /* leyenda: una línea que se desliza */
  .legendbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:12px;padding:8px 12px;margin-bottom:10px}
  .legendbar::-webkit-scrollbar{display:none}
  /* OJO: el contenedor de la rejilla NECESITA altura. Sin ella (max-height:none)
     la cabecera de días no tiene a qué pegarse y en cuanto bajas una fila estás
     mirando columnas de códigos sin saber de qué día son (auditoría 06/09). */
  #planTable.tscroll{max-height:max(280px, calc(100dvh - 232px));overscroll-behavior:contain}
  #semRoot.actwrap,#actRoot.actwrap{max-height:max(280px, calc(100dvh - 196px));overscroll-behavior:contain}
  .tablewrap.card,.card.actwrap{padding:0;border-radius:12px}
  /* Semana: columnas fijas para que las fichas se plieguen dentro de la celda
     en vez de estirar la columna a lo que mida su contenido */
  table.semt{table-layout:fixed;width:calc(118px + 7 * 96px)}
  .semt th{width:96px;min-width:96px}
  .semt th.lbl{width:118px}
  .wav,.wadd,.wtg{min-width:40px;height:44px}   /* la medida del dedo es la altura */
  .wcell{gap:4px;min-height:48px}
}

/* ---------- 15. LO QUE SOBRA EN LA MANO ----------
   La guía de tres pasos de Día (420 px) y el párrafo de Actividad son de
   escritorio: en el móvil se consulta y se retoca, no se aprende a planificar.
   Los botones «＋ SEM / ✕ SEM» de Semana abrían o cerraban una actividad la
   semana entera: en 118 px se partían en dos líneas y hacían las filas de 170 px;
   el ＋ de cada día sigue ahí. Y en Mes el nombre corto y sin la palabra
   «Facultativo», que en 118 px solo estorbaba. */
.ncorto{display:none}
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .guia{display:none}
  #view-actividad .dnav>span{display:none}
  #view-semana .wacts{display:none}
  #view-actividad .wacts{display:flex;gap:4px;margin-top:4px}
  #view-actividad .wacts button{flex:1;min-width:0;min-height:44px;font-size:11px;padding:0 2px}
  .nlargo,.nrol{display:none}
  .ncorto{display:inline}
  .pn small{font-size:10px}
  .pn b{font-size:12.5px}
}

/* ---------- 16. LAS REGLAS QUE PERDÍAN POR ESPECIFICIDAD ----------
   OJO: una regla de un solo nombre de clase de este fichero (`.btn{min-height}`)
   NO gana a `.contenedor .btn{min-height:32px}` de un fichero anterior, por muy
   tarde que se concatene. Cualquier `X .btn{…}` de escritorio hay que repetirlo
   aquí con las dos clases. Auditoría del 06/09: las flechas de mes del
   profesional (la ÚNICA pantalla que ven los 22) seguían en 38×32. */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .perfilmes .btn{min-height:44px;min-width:44px;padding:10px 12px}
  .hoyh .btn-mini,.hoyln .btn-mini{min-height:44px}
  .popb,.updb,.semk{min-height:44px}
  .cvnav{min-width:44px;min-height:44px}
  .pmore summary,.cvhist summary,.festotros summary,.aptbox summary{min-height:44px;display:flex;align-items:center}
  .gclose{min-width:44px;min-height:44px;top:2px;right:2px;display:grid;place-items:center}
  /* «✕ cerrar» de Día: cierra la actividad y saca a todo el mundo. Medía 66×24
     al 60 % de opacidad. La confirmación ya la tiene. */
  .closebtn{opacity:1;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--ink3)}
  /* el ＋ de ausencia del Mes: 44 px y SIN montarse encima del nombre (float) */
  .pnaus{display:none}          /* en el móvil el nombre abre un menú: ficha o ausencia */
  td.pname .pn{display:block}
  .pn b .dot2{display:none}     /* el color ya lo llevan las pastillas; 96 px no dan para más */
  /* el trabajador no tiene barra inferior: los 84 px reservados para ella eran
     un hueco vacío al pie de cada pantalla (el 15 % de un iPhone SE) */
  .modo-empleado main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}   /* ahora sí tiene barra inferior */
  /* la lista de próximos días: filas de 52 px en vez de 72, para que el
     calendario del mes quede una pantalla más cerca */
  #view-perfil .festrow{padding:5px 8px;gap:8px;margin-bottom:4px}
  #view-perfil .festfecha{width:40px;padding:2px 0}
  #view-perfil .festfecha b{font-size:14px}
  #view-perfil .festinfo b{font-size:12px}
}
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  /* Día: la ficha de una persona no encoge (nowrap) y se salía de su caja por
     debajo del «✕ cerrar», que tapaba la × de quitar. Las fichas ocupan su fila
     entera y el «cerrar» va debajo, a la derecha: nada encima de nada. */
  .chips{flex:1 1 100%}
  .pchip{max-width:100%}
  .closebtn{margin-left:auto}
}

/* ---------- 17. ACTIVIDAD EN LA MANO ----------
   La cuadrícula del mes tenía 591 casillas de 31 px a 4 px unas de otras (y
   cerrar un día retira a la gente); por semanas, el nombre de cada actividad a
   10,5 px y la sala a 8,5. */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  #view-actividad .act td{padding:2px;min-width:48px}
  #view-actividad .act .tg{width:44px;height:44px}
  #view-actividad .act td.lbl,#view-actividad .act th.lbl{min-width:104px;max-width:104px}
  #view-actividad .actcount{font-size:11px}
  .achip{font-size:12px}
  .achip em,.apn{font-size:11px}
  .asecl{font-size:10px}
  .dayc header small,.dayc summary small{font-size:11px}
  .dayc>summary{min-height:44px}
  .dayc:not([open])>summary{border-bottom:0}
}

/* ---------- 18. EL MODELO DE DIÁLOGO EN LA MANO ----------
   Auditoría del 06/09, veinte diálogos abiertos uno a uno:
   · el fondo se desplazaba por detrás de todos (al cerrar, el mes estaba en
     otro sitio): overscroll contenido y el fondo no responde al gesto;
   · la ✕ iba en absoluto dentro de la tarjeta, que es justo lo que se desplaza:
     al bajar desaparecía. Ahora es sticky: siempre en la esquina;
   · el botón de confirmar (Asignación manual, los cuatro pasos de Cobertura)
     quedaba entre 500 y 1.100 px por debajo del borde: la barra de acción se
     queda pegada al pie de la hoja, donde cae el pulgar;
   · las listas de personas con scroll propio dentro de una hoja con scroll
     dentro de una página con scroll: solo se desplaza la hoja;
   · con el teclado abierto las hojas suben lo que el teclado tapa (--kb). */
.popfondo{display:none}
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .ovl{overscroll-behavior:contain;touch-action:none;bottom:var(--kb,0px)}
  .ovcard,.ovcard.big{overscroll-behavior:contain;touch-action:pan-y}
  .ovcard .ovx{position:sticky;top:0;float:right;margin:-6px -4px 0 0;z-index:5;background:var(--surface2);box-shadow:0 0 0 3px var(--surface)}
  .ovcard:not(.incard) .bar,.ovcard:not(.incard) .cvgen,.ovcard:not(.incard) .cvbtns,.asigbar{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--surface);margin:0 -14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 14px rgba(0,0,0,.08);z-index:4}
  .perslist{max-height:none;overflow:visible}
  .popfondo{display:block;position:fixed;inset:0;z-index:119;background:rgba(20,24,30,.28);touch-action:none}
  .pop.sheet{bottom:calc(64px + env(safe-area-inset-bottom) + var(--kb,0px))}
  .ovcard:focus-within{padding-bottom:calc(18px + env(safe-area-inset-bottom) + 30vh)}
}

/* ---------- 19. LA BARRA INFERIOR DEL PROFESIONAL ----------
   Sus cuatro pestañas iban pegadas al contenido: al bajar por la planilla
   quedaban 840 px por encima del borde y no había forma de ir a la Bandeja sin
   volver arriba. En el móvil la barra inferior es suya también. Y en horizontal
   la cabecera se encoge: un teléfono tumbado tiene 390 px de alto. */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .modo-empleado .bnav.bnav-emp{display:flex !important}
  .modo-empleado .perfiltabs{display:none}
  .bnav button{position:relative}
  .bnavn{position:absolute;top:4px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;font-style:normal;display:inline-flex;align-items:center;justify-content:center}
}
@media (max-height:520px) and (pointer:coarse){
  .topbar{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  .brand svg:first-child{width:24px;height:24px}
  .brand .bname{font-size:17px}
  .hlogo{width:22px;height:22px}
  .bnav button{min-height:44px;padding:2px 0}
  .bnav button span{display:none}
}

/* ---------- 20. LOS DOS PRIMEROS TOQUES DEL JEFE ----------
   El nombre en la rejilla del Mes (abre el menú de la persona) medía 83×36; los
   24 destinatarios del aviso eran chips de 30 px dentro de un scroll de 220 px
   dentro de la hoja. */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .plan td.pname .pn{min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .rcp{min-height:44px;font-size:13px;padding:4px 12px 4px 4px}
  .rcpgrid{max-height:none}
}

/* v2.35.0 · Admin · Día en pantallas estrechas: la fila «nombre · libra la mañana · guardia»
   de «Salientes de hoy» no cabe en una línea a 320 px; se parte en dos en vez de ensanchar la
   tarjeta y, con ella, toda la columna del día */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .srow{flex-wrap:wrap;row-gap:2px}
  .srow .nm{flex:1 1 auto}
  .srow small{flex-basis:100%;margin-left:32px;white-space:normal;font-size:11px}
}

/* 21-pasarela-app.css */
/* ============ PASARELA · marca, casillas, eventos, generador ============ */
/* pareja de logos en la barra: Shiftia · logo del grupo (o su nombre en texto) */
.glogo{display:inline-flex;align-items:center;gap:6px;flex:none}
.glogo .hlogo{width:28px;height:28px;border-radius:7px;object-fit:cover;display:block}
.glogo .gword{font-family:'Pinyon Script','DM Sans',cursive;font-size:15px;line-height:1;color:var(--ink2);white-space:nowrap;letter-spacing:.01em}
.glogo .gword b{font-weight:600;color:var(--ink)}
.glogo.big .hlogo{width:46px;height:46px;border-radius:12px}
.glogo.big .gword{font-size:20px}
.coop{width:1.5px;height:22px;background:var(--border);flex:none}
.dotwarn{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.iconbtn{position:relative}
.fbrand{display:inline-flex;align-items:center;gap:7px}

/* ============ HOY: cuatro locales, dos casillas ============ */
.locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.loccard{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-sm);overflow:hidden;border-top:4px solid var(--lc,var(--accent))}
.lochd{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--border2)}
.lochd .ldot{width:12px;height:12px;border-radius:4px;background:var(--lc)}
.lochd b{font-family:var(--font-d);font-size:17px;letter-spacing:-.2px}
.lochd .lmini{margin-left:auto;display:flex;gap:6px}
.lochd .btn-mini{min-height:30px;padding:5px 10px}
.casilla{padding:10px 14px 12px;border-bottom:1px solid var(--border2)}
.casilla:last-child{border-bottom:0}
.casilla.corta{background:color-mix(in srgb, var(--warn-bg) 70%, transparent)}
.casilla.cerrada{opacity:.6}
.cashd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cashd .fr{font-family:var(--mono);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.cashd .cnt{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--ink);background:var(--surface2);border-radius:6px;padding:2px 7px}
.cashd .cnt.falta{background:var(--warn-bg);color:var(--warn)}
.cashd .cnt.ok{background:var(--ok-bg);color:var(--ok)}
.cashd .sup{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--warn);cursor:help}
.cashd .ref{font-family:var(--mono);font-size:9.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:2px 6px;cursor:help}
.cashd .hor{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.caslista{display:flex;flex-direction:column;gap:6px}
.pchip{position:relative;padding-left:9px}
.pchip .pos{flex:none;font-family:var(--mono);font-size:10px;font-weight:800;color:var(--ink3);width:14px;text-align:center}
.pchip .pnom{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .bdg{flex:none;font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.08em;border-radius:5px;padding:2px 5px}
.bdg.abre{background:var(--grad);color:#fff}
.bdg.cocina{background:var(--ink);color:var(--bg)}

.bdg.ref{background:var(--accent-l);color:var(--accent)}

.pchip.forzado{border-color:color-mix(in srgb, var(--bad) 45%, var(--border));box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--bad) 35%, transparent)}
.pchip .rmx{margin-left:2px}
.addchip.corta{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.caslista .addchip{min-height:40px;padding:8px 14px;justify-content:center}
.cascerr{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:8px}

.evchip i{width:18px;height:18px;border-radius:50%;background:var(--ec,var(--accent));display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:10px;font-weight:900}

.evrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.hoyside .scard b.t{font-family:var(--font-d);font-size:14px;display:block;margin-bottom:6px}
.srow .lp{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}

/* ============ selector de personas ============ */
.picker{width:340px}
.prowp .prsub{display:block;font-size:10px;color:var(--ink3);font-weight:600;white-space:normal;line-height:1.3}

.popb.peligro{color:var(--bad)}
.popb.peligro:hover{border-color:var(--bad)}

/* ============ SEMANA: cuadrante local × franja × día ============ */
.semt th.lbl{min-width:190px;max-width:190px}

.pill .fz{position:absolute;top:-4px;left:-4px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:1.5px solid var(--surface)}
.pill.ev{box-shadow:inset 0 0 0 1.5px var(--accent)}
.plan th.day .evd{display:block;font-size:7px;color:var(--accent);font-weight:800;line-height:1}
.plan th.day.evday{background:var(--accent-l)}
tr.frow td.pname .lp{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.futbol{display:inline-flex;gap:6px;flex-wrap:wrap}
.futbol .btn{padding:9px 13px;font-size:13px;border-left:4px solid var(--ec)}
.futbol .btn:hover{border-left-color:var(--ec)}
.mesev{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.legendbar .lp{display:inline-block;width:12px;height:12px;border-radius:3px}

/* ============ diálogo de evento ============ */
.evform .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reflist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.refrow{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface3)}
.refrow i{width:10px;height:10px;border-radius:3px;background:var(--lc);flex:none}
.refrow b{flex:1;font-size:13px}
.refrow input{width:58px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;padding:6px 8px;text-align:center;font-family:var(--mono)}
.eqrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.eqk{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink2);border-left:4px solid var(--ec)}
.eqk.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent);border-left-color:var(--ec)}

/* ============ GENERADOR ============ */
.gengrid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.gengrid{grid-template-columns:minmax(0,1fr)}}
.genpanel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:12px}
.genpanel .pinlbl{margin:0}
.genopt{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);cursor:pointer;line-height:1.4}
.genopt input{accent-color:var(--accent);margin-top:2px;flex:none}
.genopt b{color:var(--ink)}
.motor{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.motor button{border:1.5px solid var(--border);background:var(--surface3);border-radius:11px;padding:10px;text-align:left;font:inherit;color:var(--ink2);cursor:pointer}
.motor button b{display:block;font-size:13px;color:var(--ink)}
.motor button small{font-size:10.5px;line-height:1.3;display:block;margin-top:2px}
.motor button.on{border-color:var(--accent);background:var(--accent-l)}
.motor button:disabled{opacity:.5;cursor:not-allowed}
.genres{display:flex;flex-direction:column;gap:12px}
.genkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.genk{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.genk b{display:block;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.genk span{font-size:11px;color:var(--ink3)}
.genk.warn b{color:var(--warn)} .genk.ok b{color:var(--ok)} .genk.bad b{color:var(--bad)}
.gendia{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.gendia .gdh{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--surface2);font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.gendia .gdh small{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;font-family:var(--font);font-size:12px;color:var(--ink3)}
.genrow{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--border2);font-size:13px}
.genrow .av{width:26px;height:26px;font-size:9.5px;border-radius:8px}
.genrow .gtxt{flex:1;min-width:0}
.genrow .gtxt b{display:block;font-size:13px;line-height:1.25}
.genrow .gtxt small{color:var(--ink3);font-size:11px;display:block;white-space:normal}
.genrow .lpill{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:800;color:#fff;background:var(--lc);border-radius:6px;padding:3px 7px}
.genrow.hueco{background:var(--bad-bg)}
.genrow.hueco .gtxt b{color:var(--bad)}
.genvacio{padding:26px;text-align:center;color:var(--ink3);font-size:13px;background:var(--surface);border:1px dashed var(--border);border-radius:14px}
.genbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);padding:10px 0}
.pqn{font-size:11px;color:var(--ink2);margin-top:3px}
.pqn b{color:var(--ink)}

/* ============ revisión ============ */
.revitem .lpill{flex:none;font-family:var(--mono);font-size:9px;font-weight:800;color:#fff;background:var(--lc);border-radius:5px;padding:2px 6px}

/* ============ selector de días (dowk) reutilizado del piloto ============ */
.dowset{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 8px}
.dowk{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink2);font-family:var(--mono);font-size:12px;font-weight:800;cursor:pointer}
.dowk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pinlbl{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:10px 0 4px;font-family:var(--mono)}
.pinlbl input,.pinlbl select,.pinlbl textarea{display:block;width:100%;margin-top:4px;font-family:var(--font);font-size:14px;text-transform:none;letter-spacing:0;font-weight:500}
.logininp{border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--ink);padding:9px 11px}
@media (max-width:640px){
  .locgrid{grid-template-columns:minmax(0,1fr)}
  .picker{width:auto}
  .reflist{grid-template-columns:1fr}
  .motor{grid-template-columns:1fr}
  .futbol .btn{padding:8px 10px;font-size:12.5px}
}

/* ---------- modo empleado (cada persona ve solo lo suyo) ---------- */
.modo-empleado #view-hoy,.modo-empleado #view-horas,.modo-empleado #view-generador,.modo-empleado #view-semana,.modo-empleado #view-mes,.modo-empleado #view-equipo{display:none!important}
.modo-empleado #view-perfil{display:block}
#view-perfil .festrow small{display:block;margin-top:2px}
#view-perfil .fichead{flex-wrap:wrap}

/* cuadrante semanal: siete días caben a 1280 px sin desplazamiento */
.semt th{min-width:140px}
.semt th.lbl{min-width:150px;max-width:150px}
.wav{min-width:40px}

/* ---------- entrevistas (en construcción) ---------- */
.tab .tabwip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
.dchip.wip{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb, var(--warn) 40%, transparent)}
.evhero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px 32px;margin-top:16px;box-shadow:var(--shadow-sm,0 1px 3px rgba(0,0,0,.06));position:relative;overflow:hidden}
.evhero::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg, color-mix(in srgb, var(--teal) 10%, transparent), transparent 55%);pointer-events:none}
.evhero-txt{position:relative}
.evhero h2{font-family:var(--font-d);font-size:26px;line-height:1.2;letter-spacing:-.01em;margin:8px 0 10px;color:var(--ink);font-weight:500}
.evhero h2 b{font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.evhero p{font-size:14px;color:var(--ink2);line-height:1.55;margin:0 0 16px;max-width:560px}
.evsteps{display:flex;flex-wrap:wrap;gap:8px}
.evstep{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink3);background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:5px 12px 5px 5px}
.evstep i{width:20px;height:20px;border-radius:50%;background:var(--border);color:var(--ink2);font-style:normal;font-family:var(--mono);font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.evstep.on{color:var(--ink);border-color:color-mix(in srgb, var(--teal) 50%, transparent);background:color-mix(in srgb, var(--teal) 10%, var(--surface))}
.evstep.on i{background:var(--grad);color:#fff}
.evhero-art{position:relative;height:190px;display:flex;align-items:center;justify-content:center}
.evdiamond{position:absolute;width:150px;height:150px;border:2px solid color-mix(in srgb, var(--accent) 35%, transparent);border-radius:18px;transform:rotate(45deg);background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 8%, transparent), color-mix(in srgb, var(--teal) 14%, transparent))}
.evdiamond.d2{width:112px;height:112px;border-color:color-mix(in srgb, var(--teal) 45%, transparent);background:none;border-style:dashed;animation:evspin 24s linear infinite}
@keyframes evspin{to{transform:rotate(405deg)}}
.evbadge{position:relative;font-family:var(--mono);font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--warn);background:var(--warn-bg);border:1px solid color-mix(in srgb, var(--warn) 45%, transparent);border-radius:999px;padding:7px 14px;box-shadow:0 6px 18px color-mix(in srgb, var(--warn) 18%, transparent)}
.evgrid{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px;margin-top:14px}
.evcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 16px 12px;opacity:.9;position:relative;overflow:hidden;min-height:250px}
.evcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, transparent 55%, var(--surface) 100%);pointer-events:none}
.evcard-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.evcount{font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--ink);line-height:1}
.evrowg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border-l,var(--border))}
.evav{width:30px;height:30px;border-radius:9px;background:var(--pc);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.evtxt{display:flex;flex-direction:column;min-width:0;flex:1}
.evtxt b{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evtxt small{font-size:11px;color:var(--ink3)}
.evst{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;white-space:nowrap;background:var(--surface2);color:var(--ink3)}
.evst.ok{background:var(--ok-bg,#e6f6ee);color:var(--ok,#1f9a6e)}
.evst.w{background:var(--accent-l);color:var(--accent)}
.evst.p{background:var(--warn-bg);color:var(--warn)}
.evst.x{background:var(--bad-bg,#fdecec);color:var(--bad)}
.evday{padding:8px 0 2px;border-top:1px solid var(--border)}
.evday>b{font-size:12px;color:var(--ink);margin-right:6px}
.evday>small{font-size:11px;color:var(--ink3)}
.evday .evrowg{border-top:0;padding-top:4px}
.evdec{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.evdec b{font-size:13px;color:var(--ink)}
.evdec small{grid-column:2;font-size:11px;color:var(--ink3)}
.evfoot{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.sk{display:block;border-radius:6px;background:linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);background-size:200% 100%;animation:evshimmer 1.8s infinite}
@keyframes evshimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.evnote{margin:14px 0 0;max-width:720px}
.modo-empleado #view-entrevistas{display:none!important}
@media (max-width:900px){.evhero{grid-template-columns:1fr;padding:22px 20px}.evhero-art{height:150px}.evgrid{grid-template-columns:1fr}.evhero h2{font-size:22px}}
@media (prefers-reduced-motion:reduce){.evdiamond.d2,.sk{animation:none}}

/* móvil: los botones de fútbol en fila con salto de línea, sin estirar «Imprimir» y «Generar» */
@media (max-width:640px){
  #view-mes .dacts{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px}
  #view-mes .futbol{display:flex;flex-wrap:wrap;gap:6px;width:100%;flex-direction:row}
  #view-mes .dacts>.btn{flex:1 1 auto;align-self:flex-start}
}

/* ---------- posiciones: marcas del prototipo (▸ ◆ P C □) y hueco disponible ---------- */
.pchip .mk.fijo{font-style:normal;color:var(--accent);margin-right:2px}
.pchip .por{display:block;font-size:10.5px;color:var(--ink3);font-weight:500;margin-top:1px}
.pchip .bdg.part,.pchip .bdg.cont,.pchip .bdg.com{font-family:var(--mono);font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--ink2)}
.pchip .bdg.cont{color:var(--teal);border-color:color-mix(in srgb, var(--teal) 50%, transparent)}
.pchip.hueco{border:1.5px dashed var(--bad);background:var(--bad-bg,rgba(204,68,68,.08));cursor:pointer}
.pchip.hueco .pnom b{color:var(--bad);font-weight:700}
.pchip.hueco .pos{background:var(--bad);color:#fff}
.wav.whueco{background:none;border:2px dashed var(--bad);color:var(--bad);font-family:var(--mono);font-size:10px;box-shadow:none}
.wav.comodin{outline:1.5px dashed color-mix(in srgb, var(--pc) 70%, var(--ink));outline-offset:-3px}
.wav sup{font-size:8px;margin-left:2px;font-weight:800;opacity:.9}

/* ---------- generador semanal: la planilla como el prototipo ---------- */
.segm{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--surface2);gap:2px;align-self:flex-start}
.segm button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--ink3);cursor:pointer;font-family:inherit}
.segm button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gsnav{margin:0;padding:0;background:none;border:0;box-shadow:none}
.gsbig{font-size:19px}
.gsres{margin:4px 0 0}
.gsemwrap{display:flex;flex-direction:column;gap:12px;margin-top:14px;overflow-x:auto}
table.gsem{width:100%;min-width:900px;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:11.5px}
table.gsem th,table.gsem td{border-bottom:1px solid var(--border);border-left:1px solid var(--border);padding:6px 7px;vertical-align:top;text-align:left}
table.gsem th:first-child,table.gsem td:first-child{border-left:0}
table.gsem tbody tr:last-child th,table.gsem tbody tr:last-child td{border-bottom:0}
table.gsem thead th{background:color-mix(in srgb, var(--lc) 12%, var(--surface2));font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:7px}
table.gsem th.gl{font-family:var(--font-d);font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);width:150px;min-width:150px}
table.gsem th.gl i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--lc);margin-right:7px;vertical-align:middle}
table.gsem th.gl small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.04em;text-transform:none;color:var(--ink3);font-weight:500;margin-top:2px}
table.gsem th.gfr{font-weight:800;color:var(--ink);font-size:12px;background:var(--surface2);width:150px}
table.gsem th.gfr small{display:block;font-size:10px;color:var(--ink3);font-weight:500}
table.gsem td.gcerr{background:var(--surface3);color:var(--ink3);font-style:italic;vertical-align:middle;text-align:center}
table.gsem td.gcamb{background:color-mix(in srgb, var(--warn) 12%, var(--surface));box-shadow:inset 3px 0 0 var(--warn)}
table.gsem td.gfalta{box-shadow:inset 3px 0 0 var(--bad)}
.gcab{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap}
.gcnt{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--ink3)}
.gcnt.bad{color:var(--bad)}
.ghk,.gcorr{font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px}
.ghk{color:var(--bad);background:var(--bad-bg,rgba(204,68,68,.1))}
.gcorr{color:var(--warn);background:var(--warn-bg)}
.gir{margin-left:auto;font-size:11px;opacity:.6}
.gslot{display:flex;align-items:flex-start;gap:5px;padding:2px 0;line-height:1.25}
.gslot>b{font-family:var(--mono);font-size:9px;font-weight:800;color:var(--ink3);min-width:11px;height:14px;border:1px solid var(--border);border-radius:3px;text-align:center;line-height:13px;background:var(--surface2)}
.gslot>span{color:var(--ink);font-weight:600;font-size:11.5px}
.gslot .gdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pc);margin-right:4px;vertical-align:middle}
.gslot small{display:block;font-size:9.5px;color:var(--ink3);font-weight:500}
.gslot .gm{font-family:var(--mono);font-size:8.5px;font-weight:800;border:1px solid var(--border);border-radius:3px;padding:0 3px;margin-left:4px;color:var(--ink2);background:var(--surface2);font-style:normal;vertical-align:middle}
.gslot .gm.gc,.gsleg .gm.gc{color:var(--teal);border-color:color-mix(in srgb, var(--teal) 50%, transparent)}
.gslot .gm.gcoct{color:#1c7c43;border-color:transparent;background:rgba(39,174,96,.12);text-transform:uppercase;letter-spacing:.06em}
.gfijo,.gcoc{text-decoration:none;font-style:normal;margin-right:2px}
.gfijo{color:var(--accent)} .gcoc{color:#1c7c43}
.gslot.ghueco>span{color:var(--bad)}
.gslot.ghueco .gtit{font-style:normal;font-weight:800;border:1.5px dashed var(--bad);border-radius:5px;padding:0 5px}
.gslot.ghueco>b{background:var(--bad);color:#fff;border-color:var(--bad)}
.glchip{display:inline-block;font-size:10.5px;font-weight:600;color:var(--ink2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;margin:2px 3px 0 0;border-left:3px solid var(--pc)}
.gln{display:block;font-family:var(--mono);font-size:9px;color:var(--ink3);margin-bottom:2px}
.gnadie{color:var(--ink3);font-size:11px}
.gsleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10.5px;color:var(--ink3);margin:10px 0 4px}
.gsleg b{font-family:var(--mono);border:1px solid var(--border);border-radius:3px;padding:0 4px;color:var(--ink3)}
.gscols{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px;margin-top:14px}
.gscol{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;min-width:0}
.gscol h3{font-family:var(--font-d);font-size:14px;margin:0 0 8px;color:var(--ink)}
.gscol h3+h3{margin-top:14px}
.gcamblist{margin:0;padding:0 0 0 2px;list-style:none;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:5px;max-height:420px;overflow:auto}
.gcamblist s{color:var(--ink3)}
.ghitem{border-left:3px solid var(--bad);padding:4px 10px;margin:0 0 10px;font-size:12px;color:var(--ink)}
.ghitem p{margin:3px 0;color:var(--ink2);font-size:12px}
.ghitem small{color:var(--ink3);font-size:11px;line-height:1.4}
.gcondlist{max-height:520px;overflow:auto;font-size:11.5px}
.gcgrp{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:8px 0 4px}
.gcond{display:flex;gap:7px;align-items:flex-start;padding:3px 0;color:var(--ink2);line-height:1.35}
.gcond i{font-style:normal;font-weight:800;color:#1c7c43;min-width:12px}
.gcond.rota i{color:var(--bad)}
.gcond.rota span{color:var(--ink)}
.gcond small{display:block;color:var(--bad);font-size:10.5px}
.gcond b{font-family:var(--mono);color:var(--ink3);font-weight:600;margin-right:2px}
.gnueva{font-family:var(--mono);font-size:8.5px;font-weight:800;color:var(--teal);letter-spacing:.08em;font-style:normal;border:1px solid color-mix(in srgb, var(--teal) 50%, transparent);border-radius:3px;padding:0 4px;margin-left:4px}
@media (max-width:1100px){.gscols{grid-template-columns:1fr}}

/* ---------- gestor de cobertura: la hoja «quién sale → quién entra» ---------- */
.cobsheet{display:flex;flex-direction:column;gap:12px}
.cobpick{display:flex;flex-wrap:wrap;gap:6px}

/* lo que hay en pantalla no es hoy: se dice a las claras y el botón «Hoy» resalta */

/* la sartén de la cocina: toma el tamaño y el color de lo que la rodea */
.icoc{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.28em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gcoc .icoc,.pxg-mk.coc .icoc{vertical-align:-.22em}

/* Primera columna fija al desplazar de lado: en Semana el local y la franja, en el
   contador de horas la persona (antes se perdía de vista de quién era cada fila).
   Su fondo tiene que ser OPACO: el tinte de la fila señalada es translúcido
   (rgba .08) y por debajo se veían las casillas del otro lado del desplazamiento,
   que se comían el nombre. El tinte va como capa encima, no como color de fondo. */
.act td.lbl,.act th.lbl{position:sticky;left:0;z-index:4;background-color:var(--surface)}
.act th.lbl{z-index:7}
.act tr.locsec td{background-color:var(--surface)}
.htab td.per,.htab th:first-child{position:sticky;left:0;z-index:2;background-color:var(--surface)}
.htab th:first-child{z-index:4;background-color:var(--surface2)}
.htab tfoot td:first-child{position:sticky;left:0;z-index:2;background-color:var(--surface2)}
.plan td.pname,.plan th.pname{background-color:var(--surface)}
.plan th.pname{background-color:var(--surface2)}
.plan tr.frow td.pname{background-color:var(--surface3)}
/* el tinte de la fila lo pinta una regla anterior con el atajo `background`, que
   reponía el color translúcido: aquí se fija el fondo opaco y el tinte como capa */
.plan tr.prow:hover td.pname,.plan tr.prowp:hover td.pname,.htab tr:hover td.per{background-color:var(--surface);background-image:linear-gradient(var(--accent-l),var(--accent-l))}
.plan tr.frow:hover td.pname{background-color:var(--surface3)}
