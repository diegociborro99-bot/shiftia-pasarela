/* 22-pasarela-equipo.css */
/* ============ PASARELA · EQUIPO, FICHA Y AJUSTES DE LOS LOCALES ============
   Solo variables del tema (claro/oscuro salen solos); el único color «fijo» es el
   de cada local, que llega en --lc desde l.color. Objetivos táctiles ≥ 44 px y
   rejillas a una columna por debajo de 640 px, al final del fichero. */

/* ---------- secciones por local ---------- */
.eqsec{margin-bottom:6px}
.eqsec .sechdr{flex-wrap:wrap}
.eqsec .sechdr .ldot{width:12px;height:12px;border-radius:4px;background:var(--lc,var(--ink3));flex:none}
.eqsec .sechdr .eqajustes{margin-left:auto}
.eqsec .festvacio{padding:10px 14px;border:1.5px dashed var(--border);border-radius:14px}
.pcard.baja{opacity:.72;background:var(--surface3)}
.pcard.baja .av{filter:grayscale(.5)}
.pcfoot{display:flex;justify-content:flex-end;margin-top:8px}
/* la ✕ de una ausencia en la tarjeta: un objetivo de verdad, no un carácter */
.abschips .abschip button{min-width:22px;min-height:22px;border-radius:6px;cursor:pointer;opacity:.75}
.abschips .abschip button:hover{opacity:1;background:rgba(0,0,0,.08)}
/* permiso: no existía en el piloto; ámbar suave */
.a-PERM{background:var(--for-bg);color:var(--for-tx)}

/* ---------- chips de condiciones ---------- */
.tchip .ldot,.festinfo .ldot,.abrenm .ldot,.segk .ldot,.locchip .ldot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--lc,var(--ink3));margin-right:5px;vertical-align:-1px;flex:none}
.tchip.loc{border-color:color-mix(in srgb,var(--lc,var(--border)) 35%,var(--border2))}
.tchip.loc.warn{background:var(--warn-bg);color:var(--warn)}
.tchip small{font-size:9.5px;font-weight:600;color:var(--ink3)}
.tchip.fix small,.tchip.warn small,.tchip.teal small{color:inherit;opacity:.8}
.tchip .festrm{width:18px;height:18px;padding:0;font-size:9px;margin:-2px -4px -2px 0}

/* ---------- chips de local (toggle, con su color) ---------- */
.locset{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.locchip{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;transition:border-color .12s,background .12s,transform .12s var(--ease2)}
.locchip:hover{border-color:var(--lc,var(--accent))}
.locchip:active{transform:scale(.96)}
.locchip.on{background:color-mix(in srgb,var(--lc,var(--accent)) 16%,var(--surface));border-color:var(--lc,var(--accent));color:var(--ink)}
.loctabs .segk{display:inline-flex;align-items:center}
.loctabs .segk.on .ldot{background:var(--lc)}

/* ---------- filas de reglas (nunca con, cubre a, vetos, ausencias, cocina) ----------
   Estas clases venían del piloto (10-festivos.css) y ese fichero no viajó: se
   definen aquí con los mismos nombres para que 20-movil.css las siga encontrando. */
.festrow{display:flex;align-items:center;gap:10px;border:1px solid var(--border2);border-left:4px solid var(--lc,var(--border));border-radius:11px;background:var(--surface);padding:7px 10px;margin-bottom:6px;min-width:0}
.festrow .av{width:26px;height:26px;font-size:9px}
.festinfo{flex:1;min-width:0}
.festinfo b{display:block;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.festinfo small{display:block;font-size:10.5px;color:var(--ink3);font-weight:600}
.festrm{flex:none;border:0;background:none;color:var(--ink3);font-size:12px;cursor:pointer;padding:6px 8px;border-radius:8px;min-width:30px;min-height:30px}
.festrm:hover{background:var(--bad-bg);color:var(--bad)}
.festvacio{font-size:11.5px;color:var(--ink3);font-weight:600;padding:8px 2px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;align-items:center}
.addrow{display:flex;gap:6px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.addrow .logininp{flex:1 1 160px;min-width:0;padding:8px 10px;font-size:13px}
.addrow .btn-mini{flex:none;min-height:36px}
.addrow3 .logininp{flex:1 1 130px}
.cubrectl{display:flex;gap:6px;flex:0 1 auto;min-width:0}
.cubrectl .logininp{padding:6px 8px;font-size:12px;max-width:170px}
.chkrow{margin:6px 0;min-height:32px;align-items:center}
.pinlbl small{font-family:var(--font);text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink3)}

/* ---------- ficha ---------- */
.fichnombre{width:100%;box-sizing:border-box;border:1.5px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font-family:var(--font-d);font-size:21px;font-weight:700;letter-spacing:-.4px;padding:4px 8px;margin-left:-8px;transition:border-color .15s,background .15s}
.fichnombre:hover{border-color:var(--border)}
.fichnombre:focus{outline:none;border-color:var(--accent);background:var(--surface3)}
.fichead .sub{display:block;padding-left:0}
.fichtop{margin-bottom:8px}
.fichtop .colorset{margin-top:6px}
.fichfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--border2)}
.fsec summary{display:flex;align-items:center;gap:8px;font-size:12px;min-height:36px}
.fsec summary small{font-weight:600;color:var(--ink3);font-size:11px;letter-spacing:0;text-transform:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fsecb{padding:2px 4px 6px}
.fsecb .pinlbl:first-child{margin-top:4px}
.fsecb .dowset{margin:4px 0 8px}
.fsecb textarea.logininp{resize:vertical;min-height:70px;line-height:1.45}
.abrerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--border2)}
.abrerow:last-of-type{border-bottom:0}
.abrenm{flex:1 1 140px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;min-width:0}
.ausalta{margin:8px 0 2px}
.ausalta label small{text-transform:none;letter-spacing:0;font-weight:600}

/* ---------- ajustes de los locales ---------- */
.locpanel{border-top:3px solid var(--lc,var(--accent));border-radius:12px 12px 0 0;padding-top:2px}
.locgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;align-items:start}
.locgrid2>*{min-width:0}
.colorinp{height:42px;padding:4px 6px;cursor:pointer}
.tscrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px 0 8px}
.loctab{border-collapse:separate;border-spacing:4px 3px;font-size:12px}
.loctab th{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:center;padding:2px 4px;white-space:nowrap}
.loctab tbody th{text-align:left;padding-right:8px}
.loctab td{text-align:center;padding:0;vertical-align:middle}
.loctab td.cerrado{opacity:.4}
.abretab .dowk{width:38px;height:38px}
.mincell{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:2px}
.mincell input{width:44px;height:32px;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:14px;font-weight:700;text-align:center;-moz-appearance:textfield}
.mincell input::-webkit-outer-spin-button,.mincell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mincell input:focus{outline:2px solid var(--accent);border-radius:6px}
.supk{width:24px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--ink3);font-family:var(--mono);font-size:16px;font-weight:900;line-height:1;cursor:pointer;opacity:.45}
.supk:hover{opacity:1;background:var(--surface2)}
.supk.on{opacity:1;background:var(--warn-bg);color:var(--warn)}
.supstar{color:var(--warn);font-family:var(--mono);font-size:15px}
.hortab input[type=time]{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:6px 6px;min-width:96px}
.horx{display:inline-flex;flex-direction:column;gap:3px}
.coclist{margin:4px 0 6px}
.festrow.coc .pmini{width:30px;height:30px;font-size:13px}
.festrow.coc .pmini:disabled{opacity:.3;cursor:default}

/* ---------- interruptor (toggle) ----------
   <label class="tgl"><input type="checkbox" role="switch"><span class="tglk"></span><span class="tgll">Activa</span></label>
   El input sigue en el DOM (teclado, lector de pantalla); la pista y el mando
   se pintan con los tokens: --border apagado, --accent encendido. */
.tgl{display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:none;position:relative;min-height:28px;user-select:none;-webkit-user-select:none}
.tgl input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.tglk{position:relative;display:inline-block;width:38px;height:22px;border-radius:999px;background:var(--border);border:1.5px solid var(--border);transition:background .15s,border-color .15s;flex:none}
.tglk::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .16s var(--ease)}
.tgl input:checked+.tglk{background:var(--accent);border-color:var(--accent)}
.tgl input:checked+.tglk::after{transform:translateX(16px)}
.tgl:hover .tglk{border-color:var(--accent)}
.tgl input:focus-visible+.tglk{outline:2px solid var(--accent);outline-offset:2px}
.tgll{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);min-width:52px}
.tgl input:checked~.tgll{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.tglk,.tglk::after{transition:none}}

/* ---------- características apagadas en las tarjetas ---------- */
.tchip.off{text-decoration:line-through;text-decoration-color:var(--ink3);opacity:.55;background:var(--surface2);border-color:var(--border);color:var(--ink3)}
.tchip.off b{color:var(--ink3)}

/* ---------- ficha: bloque por característica con su interruptor ---------- */
.fcar{border:1px solid var(--border2);border-radius:12px;background:var(--surface);padding:6px 10px 8px;margin:6px 0 8px;transition:opacity .15s,background .15s}
.fcarh{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.fcart{font-size:11px;font-family:var(--mono);font-weight:700;color:var(--ink3);flex:1;min-width:0;line-height:1.3}
.fcart small{font-family:var(--font);text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink3)}
.fcarb{min-width:0}
.fcarb>.pinlbl:first-child,.fcarb>.locset:first-child,.fcarb>.segrow:first-child,.fcarb>.dowset:first-child{margin-top:2px}
.fcar.off{background:var(--surface3);border-style:dashed}
.fcar.off .fcarb{opacity:.45;filter:grayscale(.6)}
.fcar.off .fcart{text-decoration:line-through}
.fcaroff{font-size:11px;color:var(--warn);font-weight:600;margin:6px 0 0;line-height:1.4}
.fsec summary small{flex:1}

/* ---------- panel «Condiciones del grupo» ---------- */
.condtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 8px}
.condcount{font-size:12.5px;color:var(--ink2);font-weight:600;flex:1 1 200px}
.condcount b{font-family:var(--mono);font-size:15px;color:var(--ink)}
.condcount small{font-size:11px;color:var(--ink3);font-weight:600}
.condq{flex:1 1 220px;padding:9px 12px;font-size:13px;min-width:0}
.condgrp{display:flex;align-items:baseline;gap:8px;margin:12px 0 4px;font-size:12.5px;color:var(--ink)}
.condgrp .micro{font-size:9.5px}
.condrow{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--border2);border-radius:11px;background:var(--surface3);margin-bottom:4px;min-height:40px;font-size:12.5px;line-height:1.4;transition:background .3s,border-color .3s}
.condrow.regla{background:var(--surface);border-color:var(--border)}
.condnum{flex:none;width:26px;text-align:right;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--accent)}
.condrow.regla .condnum{color:var(--ink3);font-size:9px;width:14px}
.condtx{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.condinfo{display:inline-block;font-size:10.5px;color:var(--ink3);font-weight:600;margin-left:4px}
.condnew{display:inline-block;vertical-align:1px;font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.1em;border-radius:6px;padding:2px 6px;margin-left:5px;background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal-tx)}
.condrow.info .condtx{color:var(--ink3)}
.condrow.info .condnum{color:var(--ink3)}
.condrow.off{background:var(--surface2);border-style:dashed}
.condrow.off .condtx{text-decoration:line-through;text-decoration-color:var(--ink3);color:var(--ink3)}
.condrow.off .condtx .condinfo{text-decoration:none}
.condrow.off .condnum{color:var(--ink3)}
.condrow .tgll{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}   /* solo para el lector de pantalla */
.condlnk{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--accent);font-size:11px;font-weight:700;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:30px;white-space:nowrap}
.condlnk:hover{border-color:var(--accent);background:var(--accent-l)}
.condrow.flash{background:var(--accent-l);border-color:var(--accent)}

/* ---------- móvil: dedos y una columna ---------- */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){
  .tgl{min-height:44px;padding:0 2px}
  .tglk{width:44px;height:26px}
  .tglk::after{width:19px;height:19px}
  .tgl input:checked+.tglk::after{transform:translateX(18px)}
  .tgll{font-size:10.5px}
  .fcarh{min-height:44px}
  .condrow{min-height:48px;padding:6px 8px;font-size:13px;flex-wrap:wrap}
  .condrow .condtx{flex:1 1 180px}
  .condlnk{min-height:40px;padding:8px 12px}
  .condtop{flex-direction:column;align-items:stretch}
  .condq{min-height:46px;font-size:16px}
  .condrow .tgl{margin-left:auto}
  .locgrid2{grid-template-columns:minmax(0,1fr)}
  .locchip,.fsec summary{min-height:44px}
  .fsecb .dowk,.abretab .dowk{width:44px;height:44px}
  .dowset{gap:6px}
  .mincell input{width:46px;height:40px;font-size:16px}
  .supk{width:34px;height:40px}
  .festrm,.tchip .festrm{min-width:44px;min-height:44px}
  .tchip .festrm{margin:-10px -12px -10px 0}
  .abschips .abschip button{min-width:32px;min-height:32px}
  .addrow{flex-direction:column;align-items:stretch}
  .addrow .logininp,.addrow .btn-mini{flex:1 1 auto;width:100%;min-height:44px}
  .cubrectl{flex:1 1 100%;flex-direction:column}
  .cubrectl .logininp{max-width:none;min-height:44px}
  .festrow{flex-wrap:wrap}
  .festrow .festinfo{flex:1 1 160px}
  .fichnombre{font-size:19px}
  .fichfoot .btn{flex:1;justify-content:center}
  .eqsec .sechdr .eqajustes{margin-left:0;flex:1 1 100%;justify-content:center;min-height:44px}
  .pcfoot .btn-mini{width:100%;justify-content:center}
  .hortab input[type=time]{min-height:44px;min-width:104px}
  .loctab tbody th{font-size:10.5px}
}

/* 23-pasarela-impresion.css */
/* ============ IMPRESIÓN · GRUPO PASARELA ============ */
/* Complementa 13-impresion-formato-del-excel.css (mecánica común: .pxpage, .pxhead,
   .pxw, .pxm, compactación, @media print). Aquí va lo propio del grupo: la pareja de
   logos, las filas por local con su color (--lc llega en el style de la fila desde
   l.color), la casilla del prototipo del 11/09 (número de posición, ▸ ◆ □, P/C, hueco
   en rojo), el turno corto en ámbar, el pie de descansos, la hoja de un local en
   grande, la planilla generada de dos páginas (clases pxg-*), las píldoras del mes y
   la tabla de horas.
   La hoja es siempre blanca: dentro de #printRoot los tokens semánticos se fijan a los
   del tema claro, para que el ámbar o el verde no salgan pálidos con la app en oscuro. */
#printRoot{--warn:#96580a;--warn-bg:rgba(212,136,58,.14);--ok:#1c7c43;--ok-bg:rgba(39,174,96,.12);--bad:#b03333;--bad-bg:rgba(204,68,68,.10);
  --vac-bg:#dc2626;--vac-tx:#fff;--ld-bg:rgba(90,138,191,.18);--ld-tx:#2a5a8f;--for-bg:rgba(212,136,58,.2);--for-tx:#96580a;--otr-bg:rgba(154,154,154,.16);--otr-tx:#5a5a5a}
/* pareja de logos: Shiftia · barra · logo del grupo (o su nombre en texto mientras no haya logo) */
.pxglogo{height:34px;max-width:120px;object-fit:contain;display:block}
.pxgword{font-family:'DM Sans','Inter',Arial,sans-serif;font-size:14px;font-weight:500;color:#1a2a33;letter-spacing:-.2px;white-space:nowrap;line-height:1}
.pxgword b{font-weight:800}

/* ---- semana general: una sección por local con su color ---- */
.pxw tr.pxloc td.sec{background:var(--lc)}
.pxw tr.pxloc td.sec small{font-weight:600;font-size:7px;letter-spacing:.02em;text-transform:none;opacity:.9;margin-left:8px}
.pxw tr.pxloc td.lblp{border-left-color:var(--lc)}
.pxw td.hueco,.pxlocal td.hueco{background:#fff4f2;border-left:3px solid #d9534f}
.pxw td.corta{border-left:3px solid #e0a02a}
.pxw td[data-cas]{padding-top:2px;padding-bottom:2.5px}
.pxw th.pxd span small{font-size:7.5px;font-weight:600;color:#c8d3da;margin-left:2px;letter-spacing:0}
.pxw th.pxd i.ev{display:block;font-style:normal;font-size:6.5px;font-weight:700;letter-spacing:.02em;text-transform:none;color:#ffd48a;white-space:normal;line-height:1.1;margin-top:1px}
.pxw td .nm+.nm{margin-top:1px}
/* turno corto: fondo ámbar y «falta n» */
.pxw td.corta{background:var(--warn-bg)}
.pxw td .falta{display:block;font-size:6.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-top:1px;white-space:nowrap}
.pxw td .falta i{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none}
.pxvacio{color:#b9c2c9;font-size:7.5px;font-style:italic}
/* tipos de ausencia que no estaban en el piloto */
.pxw .nm.a-PERM em{background:var(--for-bg);color:var(--for-tx)}
.pxw .nm.a-OTRO em{background:var(--otr-bg);color:var(--otr-tx)}
/* pie de descansos */
.pxw tr.pxdesc td.sec{background:#5c6b75}
.pxw tr.pxdesc td.lblp{border-left-color:#5c6b75}
/* leyenda del mes */
.pxchip .nm{display:inline-flex}

/* ---- la casilla del prototipo (hojas semanales y planilla generada): tamaños en em
   para que escalen con la tabla (8.5px en la semana, 12.5px en la hoja del local) ---- */
.pxg-cnt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8em;color:#8a97a0;letter-spacing:.02em;line-height:1.25;margin-bottom:.15em;white-space:nowrap}
.pxg-cnt b{color:#b8741a;font-weight:800}
.pxg-cnt em{font-style:normal;font-weight:800;margin-left:.6em;font-family:'Inter','DM Sans',Arial,sans-serif;letter-spacing:0}
.pxg-cnt em.hue{color:#c0392b} .pxg-cnt em.cor,.pxg-cnt em.fal{color:#a3610c}
.pxg-s{display:flex;gap:.4em;align-items:flex-start;line-height:1.25;margin-top:.2em}
.pxg-n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;border-radius:.3em;background:#e9eef2;color:#5c6b75;font-size:.78em;font-weight:800;font-style:normal;margin-top:.15em;line-height:1}
.pxg-b{min-width:0;flex:1}
.pxg-nm{font-weight:600;color:#1a2a33;white-space:nowrap}
.pxg-s.abre .pxg-nm{font-weight:700}
.pxg-mk{font-weight:700;margin-right:.12em;font-style:normal}
.pxg-mk.abre{color:#1a2a33} .pxg-mk.coc{color:#c2651a} .pxg-mk.com{color:#8a97a0;font-weight:400}
.pxg-tag{display:inline-block;font-style:normal;font-size:.68em;font-weight:800;line-height:1.5;padding:0 .4em;border-radius:.3em;margin-left:.45em;vertical-align:.12em;letter-spacing:.02em}
.pxg-tag.p{background:#fff1cf;color:#7a5200} .pxg-tag.c{background:#e3f1e6;color:#25603a}
.pxg-coc{font-size:.78em;color:#c2651a;margin-left:.45em;font-weight:600}
.pxg-sub{display:block;font-size:.78em;color:#8a97a0;line-height:1.2;white-space:nowrap}
.pxg-sub.bad{color:#c0392b} .pxg-sub.warn{color:var(--warn)}
.pxg-hb{display:inline-block;border:1px dashed #d9534f;color:#c0392b;font-weight:700;border-radius:.35em;padding:0 .5em;line-height:1.5;background:#fff}
.pxg-ley{display:flex;flex-wrap:wrap;gap:3px 6px;margin-top:6px;font-size:7px;color:#3d4f5a;align-items:center}
.pxg-ley>span{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:1px 6px 1px 4px;background:#f3f5f7}
.pxg-ley .pxg-n{font-size:6px;margin:0} .pxg-ley .pxg-tag{margin:0;font-size:6px} .pxg-ley .ast{color:#b8741a}
.pxg-ley>span.hue{background:#fff4f2;color:#c0392b} .pxg-ley>span.fal{background:var(--warn-bg);color:var(--warn)} .pxg-ley>span.cor{background:#fff7e0;color:#a3610c}
.pxw td .pxvacio{display:block;margin-top:2px}

/* ---- hoja de un local: vertical, letra grande, para leer de pie desde la barra ---- */
.pxlocal{font-size:12.5px}
.pxlocal th.act{width:120px;font-size:9px}
.pxlocal th.pxd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.pxlocal th.pxd span{display:block;font-size:9px;font-weight:600;color:#c8d3da;letter-spacing:0;text-transform:none}
.pxlocal th,.pxlocal td{padding:7px 10px}
.pxlocal td{vertical-align:middle}
.pxlocal td.lbld{font-weight:700;background:#fafbfc;border-left:6px solid var(--lc);white-space:nowrap}
.pxlocal td.lbld b{display:block;font-size:13.5px;line-height:1.1}
.pxlocal td.lbld span{display:block;font-size:10px;color:#5c6b75;font-weight:600;margin-top:1px}
.pxlocal td.lbld i{display:block;font-style:normal;font-size:8.5px;font-weight:800;color:var(--warn);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.pxlocal td.lbld i.ev{color:#2980b9;text-transform:none;letter-spacing:0;font-weight:700}
.pxlocal tr.wk td{background:#f6f8fa}
.pxlocal tr.wk td.lbld{background:#f0f3f5}
.pxlocal td.cerr{font-size:15px}
.pxlocal td.corta{background:var(--warn-bg)}
.pxlocal td .falta{font-size:8.5px;margin-top:3px}
.pxlocal .nm{font-size:13.5px;line-height:1.4;gap:6px}
.pxlocal .nm i{width:8px;height:8px}
.pxlocal td .nm+.nm{margin-top:2px}
.pxlocal td[data-cas]{vertical-align:top}
.pxlocal .pxg-s{margin-top:.3em} .pxlocal .pxg-cnt{margin-bottom:.3em}
.pxh3{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5c6b75;margin:12px 0 5px}
/* pie de descansos del local: tabla pequeña debajo */
.pxdesct{font-size:10px}
.pxdesct th{font-size:8px;letter-spacing:.06em;text-transform:uppercase}
.pxdesct th,.pxdesct td{padding:4px 8px;vertical-align:middle}
.pxdesct td.lbld{width:120px;font-weight:700;background:#fafbfc;border-left:4px solid var(--lc);white-space:nowrap}
.pxdesct td .nm{display:inline-flex;margin:1px 8px 1px 0;font-size:10px}
.pxdesct td .nm+.nm{margin-top:1px}

/* ---- planilla generada: las dos páginas del prototipo del cliente (11/09) ---- */
.pxg-pag{color:#1a2a33}
.pxg-pag+.pxg-pag{margin-top:0}
.pxpage.apaisado .pxg-pag{min-height:198.5mm}   /* en pantalla y en el PDF: cada bloque ocupa justo una página (194 mm útiles × 297/279) */
.pxpage.apaisado .pxg-pag:last-child{min-height:0}   /* la última no empuja nada: así el PDF no arrastra una tercera página vacía */
.pxg-head{display:flex;align-items:flex-start;gap:12px;padding-bottom:6px;margin-bottom:8px;border-bottom:1.5px solid #1a2a33}
.pxg-marca{flex:none;margin-top:6px} .pxg-marca svg{display:block;width:30px;height:30px;border-radius:7px}
.pxg-ht{flex:1;min-width:0}
.pxg-kick{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5c6b75;line-height:1.3}
.pxg-kick b{font-weight:700}
.pxg-h1{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.15;margin:2px 0 2px;color:#1a2a33}
.pxg-h1 span{font-weight:400;color:#5c6b75}
.pxg-sub{font-size:8.5px;color:#5c6b75;line-height:1.3}
.pxg-hr{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-top:4px}
.pxg-hr .pxglogo{height:26px} .pxg-hr .pxgword{font-size:12px}
.pxg-hr small{font-size:6.5px;color:#8a97a0;letter-spacing:.06em;text-transform:uppercase}
/* título de cada local: punto de su color, nombre en su color y la regla de cocina */
.pxg-loc{display:flex;align-items:center;gap:5px;margin:5px 0 2px;font-size:9.5px;line-height:1.2}
.pxg-loc i{width:7px;height:7px;border-radius:50%;background:var(--lc,#8a97a0);flex:none}
.pxg-loc b{color:var(--lc,#1a2a33);font-weight:800}
.pxg-loc span{font-size:7px;color:#8a97a0}
.pxg-loc.gris{--lc:#8a97a0} .pxg-loc.gris b{color:#1a2a33}
table.pxg-tab{border-collapse:collapse;width:100%;font-size:8px;table-layout:fixed;border:1px solid #d9e0e6}
.pxg-tab th,.pxg-tab td{border:1px solid #e2e8ec;padding:2px 4px;text-align:left;vertical-align:top}
.pxg-tab th{background:#eef2f5;font-size:6.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#3d4f5a;padding:2.5px 4px;line-height:1.2}
.pxg-tab th span{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;color:#8a97a0;letter-spacing:0;font-size:7px}
.pxg-tab th.pxg-turno,.pxg-tab td.pxg-lbl{width:58px}
.pxg-tab td.pxg-lbl{background:#fafbfc;vertical-align:top}
.pxg-tab td.pxg-lbl b{display:block;font-size:8.5px;line-height:1.15}
.pxg-tab td.pxg-lbl small{display:block;font-size:6.5px;color:#8a97a0;line-height:1.2;margin-top:1px}
.pxg-tab td.pxg-c{padding:2px 4px 3px}
.pxg-tab td.cerr{background:#fafbfc} .pxg-tab td.cerr span{font-size:7.5px;font-style:italic;color:#b9c2c9}
.pxg-tab td.corr{background:#fff7e0;border-left:3px solid #e0a02a}
.pxg-tab td.corta{background:#fff7e0}
.pxg-tab td.hueco{background:#fff4f2;border-left:3px solid #d9534f}
.pxg-chips{display:flex;flex-wrap:wrap;gap:2px 3px;margin-top:1px}
.pxg-chips span{display:inline-flex;align-items:center;gap:3px;border:1px solid #d9e0e6;border-radius:3px;padding:0 3px;font-size:6.5px;line-height:1.55;color:#3d4f5a;background:#fff;white-space:nowrap}
.pxg-chips span i{width:5px;height:5px;border-radius:50%;flex:none}
.pxw td .pxg-chips{margin-top:1px}
.pxg-lib td.pxg-c .pxvacio{display:block;margin-top:1px}
/* página 2: tres columnas, cajas de huecos, condiciones nuevas, preguntas, lista y pie */
.pxg-p2 .pxg-h1 span{font-weight:400}
.pxg-cols{display:grid;grid-template-columns:1.15fr 1.3fr 1fr;gap:0 16px;align-items:start}
.pxg-col{min-width:0}
/* con más de dos huecos, la columna central se ensancha y los reparte en dos subcolumnas */
.pxg-cols.muchos{grid-template-columns:.85fr 2.2fr .95fr}
.pxg-cols.muchos .pxg-col:nth-child(2) .pxg-hueco{break-inside:avoid;page-break-inside:avoid}
.pxg-cols.muchos .pxg-col:nth-child(2){column-count:2;column-gap:10px}
.pxg-cols.muchos .pxg-col:nth-child(2) .pxg-h2{column-span:all}
.pxg-h2{font-size:9.5px;font-weight:800;margin:4px 0 4px;padding-bottom:2px;border-bottom:1px solid #d9e0e6;color:#1a2a33;line-height:1.2}
.pxg-h2c{margin-top:7px}
.pxg-p{font-size:7.2px;line-height:1.4;color:#3d4f5a;margin:0 0 3px}
.pxg-p.mut{color:#8a97a0;font-style:italic}
.pxg-p.pq b{font-weight:700;color:#3d4f5a}
.pxg-p .bad,.pxg-hueco .bad{color:#c0392b}
.pxg-cambio{margin:0 0 6px}
.pxg-cambio h4{font-size:8px;font-weight:800;margin:0 0 2px;color:#1a2a33}
.pxg-antes{font-size:6.8px;color:#8a97a0;line-height:1.35} .pxg-antes s{color:#8a97a0}
.pxg-ahora{font-size:6.8px;color:#1a2a33;font-weight:700;line-height:1.35} .pxg-ahora b{color:#1c7c43}
.pxg-nueva-cas{font-style:normal;font-weight:800;color:#1c7c43;text-transform:uppercase;font-size:6px;letter-spacing:.06em}
.pxg-hueco{border:1px solid #e8b4ae;background:#fff7f6;border-radius:5px;padding:5px 7px 4px;margin:0 0 6px}
.pxg-hueco h4{font-size:8px;font-weight:800;margin:0 0 2px;color:#c0392b}
.pxg-hueco .pxg-p{margin-bottom:2.5px}
.pxg-des{font-size:6.8px;color:#5c6b75;line-height:1.4;margin:3px 0 0;padding-top:3px;border-top:1px dashed #e8b4ae}
.pxg-des b{color:#1a2a33}
.pxg-nueva{display:flex;gap:6px;margin:0 0 5px;align-items:flex-start}
.pxg-nueva i{flex:none;font-style:normal;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:7px;font-weight:800;color:#1c7c43;margin-top:1px;min-width:11px}
.pxg-nueva p{margin:0;font-size:7.2px;line-height:1.4;color:#3d4f5a} .pxg-nueva p b{color:#1a2a33}
.pxg-nueva p small{display:block;font-size:6.5px;color:#c0392b;margin-top:1px}
.pxg-preg{display:flex;gap:6px;margin:0 0 5px;align-items:flex-start}
.pxg-preg i{flex:none;width:7px;height:7px;border:1.5px solid #1c7c43;border-radius:50%;margin-top:2px}
.pxg-preg p{margin:0;font-size:7.2px;line-height:1.4;color:#3d4f5a} .pxg-preg p b{color:#1a2a33}
.pxg-conds{column-count:4;column-gap:14px;margin-top:2px}
.pxg-conds.muchas{column-count:5;column-gap:10px}
.pxg-cond{display:flex;gap:3px;align-items:flex-start;break-inside:avoid;font-size:6.5px;line-height:1.3;color:#3d4f5a;margin-bottom:1.5px}
.pxg-cond i{flex:none;font-style:normal;font-family:ui-monospace,Menlo,Consolas,monospace;color:#8a97a0;min-width:11px;text-align:right;font-size:6px;padding-top:.5px}
.pxg-cond b{flex:none;font-weight:800;font-size:6.5px;width:7px} .pxg-cond b.ok{color:#1c7c43} .pxg-cond b.ko{color:#c0392b}
.pxg-cond span{min-width:0}
.pxg-cond.info{color:#6f7d87}
.pxg-cond em.nueva{font-style:normal;font-weight:800;color:#1c7c43;font-size:5.5px;letter-spacing:.06em;margin-left:2px}
.pxg-cond small{display:block;color:#c0392b;font-size:6.2px;line-height:1.25}
.pxg-fin{margin-top:7px;border:1px solid #bfe3cf;background:#f2faf5;border-radius:5px;padding:5px 8px;font-size:7.4px;line-height:1.45;color:#3d4f5a}
.pxg-fin b{color:#1c7c43}
.pxg-foot{margin-top:8px;font-size:6.5px;color:#8a97a0}
/* compactación (montarImpresion la pone si una página no cabe) */
.compacto .pxg-tab{font-size:7.4px} .compacto .pxg-tab td.pxg-c{padding:1px 3px 2px} .compacto .pxg-loc{margin:3px 0 1px}
.compacto .pxg-cond{font-size:6px} .compacto .pxg-p,.compacto .pxg-nueva p,.compacto .pxg-preg p,.compacto .pxg-des{font-size:6.7px}
.compacto .pxg-hueco{padding:3px 6px 3px;margin-bottom:4px} .compacto .pxg-fin{font-size:7px;padding:4px 7px}
.compacto2 .pxg-tab{font-size:6.8px} .compacto2 .pxg-tab td.pxg-c{padding:1px 2px} .compacto2 .pxg-h1{font-size:15px}
.compacto2 .pxg-cond{font-size:5.6px} .compacto2 .pxg-conds{column-count:5} .compacto2 .pxg-p,.compacto2 .pxg-nueva p,.compacto2 .pxg-preg p,.compacto2 .pxg-des{font-size:6.2px}
.pxpage.compacto .pxsem{font-size:8px} .pxpage.compacto2 .pxsem{font-size:7.4px}

/* ---- tablón del mes: píldora con el color del local; dos colores si dobla ---- */
.pxm td .pm,.pxchip .pm{display:inline-block;min-width:15px;padding:0 3px;border-radius:4px;background:var(--lc);color:#fff;font-weight:800;font-size:7.5px;line-height:1.7;letter-spacing:.02em;text-align:center}
.pxm td .pm.dobla,.pxchip .pm.dobla{background:linear-gradient(90deg,var(--lc) 50%,var(--lc2) 50%)}
.pxm td.a-PERM,.pxchip.a-PERM{background:var(--for-bg);color:var(--for-tx)}
.pxm tr.baja td.nom{color:#8a97a0}
.pxm td .falta small{font-size:5.5px;margin-left:1px;font-weight:600;letter-spacing:.04em}

/* ---- horas del mes ---- */
table.pxh{border-collapse:separate;border-spacing:0;width:100%;font-size:9px;border:1px solid #d9e0e6;border-radius:8px;overflow:hidden;font-variant-numeric:tabular-nums}
.pxh th,.pxh td{border-right:1px solid #e6ebef;border-bottom:1px solid #e6ebef;padding:3px 6px;text-align:left;vertical-align:middle}
.pxh th:last-child,.pxh td:last-child{border-right:0}
.pxh th{background:#22333d;color:#fff;font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pxh th.num,.pxh td.num{text-align:right}
.pxh td.num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;color:#3d4f5a}
.pxh td.hh{font-weight:800;color:#1a2a33}
.pxh td.pos{color:var(--ok);font-weight:800}
.pxh td.neg{color:var(--bad);font-weight:800}
.pxh .mut{color:#b9c2c9;font-weight:400}
.pxh tr.baja td{color:#8a97a0}
.pxh td.nom .nm{font-weight:700}
.pxh td.loc{border-left:4px solid var(--lc);font-weight:700}
.pxh tfoot td{font-weight:800;background:#eef2f5;border-top:2px solid #22333d;color:#1a2a33}
.pxh tfoot td.num{color:#1a2a33}
.pxhloc{margin-top:2px}
.pxaviso{font-size:8.5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:4px 8px;margin:0 0 7px;font-weight:600}
.pxnota{font-size:7.5px;color:#5c6b75;margin-top:5px;line-height:1.45}

/* ---- auto-ajuste a una hoja (montarImpresion pone .compacto / .compacto2 si no cabe) ---- */
.pxpage.compacto table.pxh{font-size:8px} .pxpage.compacto .pxh th,.pxpage.compacto .pxh td{padding:2px 5px}
.pxpage.compacto2 table.pxh{font-size:7.4px} .pxpage.compacto2 .pxh th,.pxpage.compacto2 .pxh td{padding:1px 4px}
.pxpage.compacto .pxlocal{font-size:11px} .pxpage.compacto .pxlocal .nm{font-size:11.5px} .pxpage.compacto .pxlocal th,.pxpage.compacto .pxlocal td{padding:4px 8px}
.pxpage.compacto2 .pxlocal{font-size:10px} .pxpage.compacto2 .pxlocal .nm{font-size:10.5px} .pxpage.compacto2 .pxlocal th,.pxpage.compacto2 .pxlocal td{padding:3px 7px}
@media print{
  .pxh tr,.pxlocal tr,.pxdesct tr,.pxg-tab tr{break-inside:avoid;page-break-inside:avoid}
  .pxh thead{display:table-header-group}
  .pxpage.apaisado .pxg-pag{min-height:0}
  .pxg-pag+.pxg-pag{page-break-before:always;break-before:page}
  .pxg-hueco,.pxg-cambio,.pxg-nueva,.pxg-preg,.pxg-fin{break-inside:avoid;page-break-inside:avoid}
}

/* 24-pasarela-horas.css */
/* ============ HORAS · contador mensual ============ */
/* Tabla persona × columnas con cifras tabulares (los números alinean por la coma),
   saldo en verde / rojo, filas desplegables con el desglose por local y las extras,
   la tabla por local y el diálogo de hora extra. Solo variables de tema; el color de
   cada local llega en --lc desde l.color. */
.haviso{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:12px;padding:11px 15px;font-size:12.5px;line-height:1.45;margin-bottom:12px;border:1px solid transparent;color:var(--ink2)}
.haviso>span{flex:1;min-width:220px}
.haviso svg{flex:none}
.haviso b{font-weight:800}
.haviso.warn{background:var(--warn-bg);border-color:color-mix(in srgb, var(--warn) 30%, transparent);color:var(--warn)}
.haviso.ok{background:var(--ok-bg);border-color:color-mix(in srgb, var(--ok) 30%, transparent);color:var(--ok)}
.haviso.info{background:var(--surface2);border-color:var(--border);color:var(--ink2)}
.haviso .btn-mini{margin-left:auto}

table.htab{border-collapse:separate;border-spacing:0;width:100%;min-width:820px;font-size:13px;font-variant-numeric:tabular-nums}
.htab th{position:sticky;top:0;z-index:3;background:var(--surface2);font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:9px 10px;text-align:left;white-space:nowrap;box-shadow:0 1px 0 var(--border)}
.htab th.num,.htab td.num{text-align:right}
.htab td{padding:8px 10px;border-bottom:1px solid var(--border2);vertical-align:middle}
.htab td.num{font-family:var(--mono);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.htab td.hh b{color:var(--ink);font-size:13.5px}
.htab tr.hrow{cursor:pointer}
.htab tr.hrow:hover td{background:var(--accent-l)}
.htab tr.hrow.open td{background:var(--surface3);border-bottom-color:transparent}
.htab tr.hrow.baja td{opacity:.55}
.htab tr.hrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.htab td.per{display:flex;align-items:center;gap:9px;min-width:200px}
.htab td.per>b{font-size:13.5px;font-weight:600}
.htab .av{width:28px;height:28px;font-size:9.5px;flex:none}
.htab .pn2{flex:1;min-width:0}
.htab .pn2 b{display:block;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htab .pn2 small{display:block;font-size:10px;color:var(--ink3);line-height:1.2}
.htab .caret{color:var(--ink3);font-size:17px;font-weight:700;line-height:1;opacity:.55;transition:transform .18s var(--ease),opacity .18s}
.htab tr.hrow.open .caret{transform:rotate(90deg);opacity:1}
.htab td.saldo.pos{color:var(--ok);font-weight:700}
.htab td.saldo.neg{color:var(--bad);font-weight:700}
.htab tfoot td{font-weight:700;color:var(--ink);background:var(--surface3);border-top:2px solid var(--border);border-bottom:0}
.htab tfoot td.num{color:var(--ink)}
.htab td.hor{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.hlocdot{display:inline-block;flex:none;width:11px;height:11px;border-radius:3px;background:var(--lc)}
.hsup{font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;background:var(--warn-bg);color:var(--warn);margin-left:8px}
/* desglose de la persona */
.htab tr.hdet td{background:var(--surface3);padding:4px 14px 14px 52px;border-bottom:1px solid var(--border)}
.hdgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.hlocs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hloc{display:inline-flex;flex-direction:column;border-left:4px solid var(--lc);background:color-mix(in srgb, var(--lc) 9%, var(--surface));border-radius:8px;padding:5px 10px;font-size:12px;line-height:1.3}
.hloc b{font-size:12.5px;color:var(--ink)}
.hloc span{font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.hxtras{display:flex;flex-direction:column;gap:4px;margin:6px 0 8px}
.hx{display:flex;align-items:center;gap:9px;font-size:12px;padding:4px 8px;border:1px solid var(--border2);border-radius:8px;background:var(--surface)}
.hx b{font-family:var(--mono);font-size:11px;color:var(--ink)}
.hx span{font-family:var(--mono);font-size:11px;color:var(--warn);font-weight:700;white-space:nowrap}
.hx em{font-style:normal;color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hxdel{border:0;background:none;color:var(--ink3);font-size:13px;padding:2px 5px;border-radius:5px;cursor:pointer;line-height:1}
.hxdel:hover{color:var(--bad);background:var(--bad-bg)}
.hnota{font-size:11px;color:var(--ink3);line-height:1.45;margin-top:4px}
.hsub{margin:18px 0 8px}
.hfoot{font-size:11px;color:var(--ink3);margin:8px 2px 4px;line-height:1.5;max-width:900px}
/* diálogo de hora extra */
.xform{display:grid;gap:10px;margin-top:12px}
.xform label{display:grid;gap:4px;font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.xform input,.xform select{font:500 14px var(--font);letter-spacing:0;text-transform:none;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface3);color:var(--ink);width:100%;min-height:42px}
.xform input:focus,.xform select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-l)}
.xform .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xform .bar{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
@media (max-width:640px){
  .htab .opt{display:none}
  table.htab{min-width:0;font-size:12px}
  .htab th{padding:8px 7px}
  .htab td{padding:7px 7px}
  .htab td.per{min-width:150px}
  .htab tr.hdet td{padding-left:12px}
  .hdgrid{grid-template-columns:1fr}
  .haviso{font-size:12px;padding:10px 12px}
  .haviso .btn-mini{margin-left:0}
}

/* 25-pasarela-compartir.css */
/* ============ COMPARTIR LA SEMANA (imagen para WhatsApp) ============ */
/* Dos piezas: el popover de elección (toda la semana o un local, cada uno con su
   color --lc) y el modo de captura de #printRoot. La hoja se monta con la misma
   cascada que al imprimir (tokens claros de 23-pasarela-impresion.css) pero fuera de
   la pantalla, para que html2canvas la dibuje sin que la vista previa llegue a verse.
   En el móvil el popover es hoja inferior (colocarPop añade .sheet). */
.popcompartir{width:340px}
.popcompartir .shareopt{display:flex;align-items:center;gap:11px;text-align:left;line-height:1.25}
.popcompartir .shareopt>span{display:flex;flex-direction:column;min-width:0;color:var(--ink)}
.popcompartir .shareopt small{font-size:10.5px;font-weight:600;color:var(--ink3);margin-top:2px}
.popcompartir .shareopt:hover>span{color:var(--accent)}
.popcompartir .shareopt:disabled{opacity:.5;cursor:default;transform:none}
.shdot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--lc,var(--ink3));box-shadow:0 0 0 3px color-mix(in srgb,var(--lc,var(--ink3)) 22%,transparent)}
.shdot.todos{background:var(--grad);box-shadow:0 0 0 3px var(--accent-l)}
.sharepie{font-size:11px;color:var(--ink3);line-height:1.45;margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}

/* ---- captura: #printRoot fuera de la pantalla, la hoja al ancho de papel y sin sombra ---- */
#printRoot.capturando{left:-4000px;right:auto;top:0;bottom:auto;width:auto;height:auto;padding:0;overflow:visible;background:#fff;pointer-events:none}
#printRoot.capturando .pxpage{margin:0;min-height:0;box-shadow:none;border-radius:0}
/* html2canvas no dibuja border-image: la regla degradada de la cabecera pasa a una línea del azul de la marca */
#printRoot.capturando .pxhead{border-image:none;border-bottom-color:#2980b9}

    <div class="loginsub">Grupo Pasarela · El 33 · Zapatillera · Bar Mónaco · Pasarela</div>
    <form id="loginForm" autocomplete="on">
      <label class="loginlbl" for="loginUser">Usuario</label>
      <input class="logininp" id="loginUser" name="username" autocomplete="username" spellcheck="false" autocapitalize="none" autofocus>
      <label class="loginlbl" for="loginPass">Contraseña</label>
      <input class="logininp" type="password" id="loginPass" name="password" autocomplete="current-password">
      <label class="loginrec"><input type="checkbox" id="loginRec" checked> Mantener la sesión en este dispositivo</label>
      <button class="btn btn-cta loginbtn" type="submit" id="loginBtn">Entrar</button>
      <div class="loginerr" id="loginErr" role="alert"></div>
    </form>
    <div id="cambioPassOvl" hidden>
      <p class="loginsub">Estás entrando con una contraseña inicial de un solo uso. Crea la tuya (mínimo 8 caracteres): solo la sabrás tú.</p>
      <form id="cambioForm">
        <label class="loginlbl" for="cnv0" id="cnv0lbl">Contraseña inicial que te dieron</label>
        <input class="logininp" type="password" id="cnv0" autocomplete="current-password">
        <label class="loginlbl" for="cnv1">Nueva contraseña</label>
        <input class="logininp" type="password" id="cnv1" autocomplete="new-password">
        <label class="loginlbl" for="cnv2">Repítela</label>
        <input class="logininp" type="password" id="cnv2" autocomplete="new-password">
        <button class="btn btn-cta loginbtn" type="submit" id="cambioBtn">Guardar mi contraseña</button>
        <div class="loginerr" id="cambioErr" role="alert"></div>
        <button class="btn btn-ghost" type="button" id="cambioSalir" style="width:100%">Salir</button>
      </form>

<script>
// Pantalla de acceso independiente: la app completa solo se sirve con sesión.
(function () {
  if (window.visualViewport) {
    var kb = function () { var h = Math.max(0, Math.round(innerHeight - visualViewport.height - visualViewport.offsetTop)); document.documentElement.style.setProperty('--kb', h + 'px'); };
    visualViewport.addEventListener('resize', kb); visualViewport.addEventListener('scroll', kb); kb();
  }
  var img = document.querySelector('.glogo img'); if (img && !img.getAttribute('src')) { img.hidden = true; img.nextElementSibling.hidden = false; }
  var form = document.getElementById('loginForm'), err = document.getElementById('loginErr'), btn = document.getElementById('loginBtn');
  try { if (localStorage.getItem('shiftia_pas_usuario')) document.getElementById('loginUser').value = localStorage.getItem('shiftia_pas_usuario'); } catch (e) {}
  if (document.getElementById('loginUser').value) document.getElementById('loginPass').focus();
  var cambio = document.getElementById('cambioPassOvl'), cambioForm = document.getElementById('cambioForm'), cambioErr = document.getElementById('cambioErr'), cambioBtn = document.getElementById('cambioBtn');
  var actualConocida = null;
  function mostrarCambio(actual) {
    actualConocida = actual || null;
    form.hidden = true; cambio.hidden = false;
    document.getElementById('cnv0').hidden = !!actual; document.getElementById('cnv0lbl').hidden = !!actual;
    document.getElementById(actual ? 'cnv1' : 'cnv0').focus();
  }
  document.getElementById('cambioSalir').addEventListener('click', function () {
    fetch('/api/logout', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(function () {}).then(function () { location.reload(); });
  });
  cambioForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var n1 = document.getElementById('cnv1').value, n2 = document.getElementById('cnv2').value;
    var act = actualConocida || document.getElementById('cnv0').value;
    if (n1.length < 8) { cambioErr.textContent = 'Mínimo 8 caracteres'; return; }
    if (n1 !== n2) { cambioErr.textContent = 'Las dos contraseñas no coinciden'; return; }
    cambioErr.textContent = ''; cambioBtn.disabled = true; cambioBtn.textContent = 'Guardando…';
    fetch('/api/password', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ actual: act, nueva: n1 }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (r) {
        if (!r.ok) { cambioErr.textContent = (r.d && r.d.error) || 'No se pudo guardar'; cambioBtn.disabled = false; cambioBtn.textContent = 'Guardar mi contraseña'; return; }
        location.replace('/');
      })
      .catch(function () { cambioErr.textContent = 'Sin conexión con el servidor: inténtalo de nuevo'; cambioBtn.disabled = false; cambioBtn.textContent = 'Guardar mi contraseña'; });
  });
  fetch('/api/yo', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { if (d && d.cambiar) mostrarCambio(null); }).catch(function () {});
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = document.getElementById('loginUser').value.trim().toLowerCase();
    var p = document.getElementById('loginPass').value;
    var rec = document.getElementById('loginRec').checked;
    if (!u || !p) { err.textContent = 'Escribe tu usuario y tu contraseña'; return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando…';
    fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario: u, password: p, recordar: rec }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (r) {
        if (!r.ok) { err.textContent = (r.d && r.d.error) || 'No se pudo entrar'; document.getElementById('loginPass').value = ''; btn.disabled = false; btn.textContent = 'Entrar'; return; }
        try { localStorage.setItem('shiftia_pas_usuario', u); localStorage.setItem('shiftia_pas_srv', '1'); } catch (e) {}
        if (r.d && r.d.cambiar) { btn.disabled = false; btn.textContent = 'Entrar'; mostrarCambio(p); return; }
        location.replace('/');
      })
      .catch(function () { err.textContent = 'Sin conexión con el servidor: inténtalo de nuevo'; btn.disabled = false; btn.textContent = 'Entrar'; });
  });
})();
</script>
