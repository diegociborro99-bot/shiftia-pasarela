<style>
/* 01-tokens.css */
/* ============ TOKENS ============ */
:root{
  --font:'Inter','DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-d:'DM Sans','Inter',-apple-system,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --bg:#f8f6f3; --surface:#ffffff; --surface2:#f2f0ed; --surface3:#faf9f7;
  --border:#e8e5e1; --border2:#f0ede9;
  /* auditoría 06/09: --ink3 daba 2,0:1 en las pestañas y --ink2 3,8:1 en las etiquetas; ahora 4,5:1 o más sobre cualquier fondo de uso común */
  --ink:#2c2c2c; --ink2:#5a5a5a; --ink3:#6e6e6e;
  --accent:#1a5a96; --accent-h:#154a7c; --accent-l:rgba(26,90,150,.08); --teal:#4ecdc4; --teal-tx:#0d8a80; --accent-solid:var(--accent);
  color-scheme:light;
  --grad:linear-gradient(135deg,#4ecdc4,#2980b9);
  --ok:#1c7c43; --ok-bg:rgba(39,174,96,.10); --warn:#96580a; --warn-bg:rgba(212,136,58,.12); --bad:#b03333; --bad-bg:rgba(204,68,68,.10);
  --sh-sm:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.02);
  --sh-md:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  --sh-lg:0 15px 40px rgba(0,0,0,.12);
  --ease:cubic-bezier(.22,.61,.36,1);
  /* secciones — de los colores del propio Excel */
  --sec-hosp:#2e8b7a; --sec-cons:#c26360; --sec-qfno:#7c5fb8; --sec-tarde:#c98a00; --sec-comp:#8a7f5c; --sec-libres:#c2793d;
  /* chips por categoría */
  --hosp-bg:rgba(46,139,122,.18); --hosp-tx:#1a6b5a;
  --cons-bg:rgba(41,128,185,.16); --cons-tx:#1a5a96;
  --qno-bg:rgba(124,95,184,.18);  --qno-tx:#4a3a8a;
  --pru-bg:rgba(180,83,9,.15);    --pru-tx:#92400e;
  --ges-bg:rgba(120,120,120,.14); --ges-tx:#5a5a5a;
  --tarde:#4a9dd4;
  --g-bg:#3f5bd6; --g-tx:#fff; --gl-tx:#3f5bd6;
  --sal-bg:rgba(204,68,68,.12); --sal-tx:#b03333;
  --vac-bg:#dc2626; --vac-tx:#fff;
  --ld-bg:rgba(90,138,191,.18); --ld-tx:#2a5a8f;
  --for-bg:rgba(212,136,58,.2); --for-tx:#96580a;
  --ant-bg:rgba(122,138,106,.2); --ant-tx:#4a5a3a;
  --otr-bg:rgba(154,154,154,.16); --otr-tx:#5a5a5a;
  --rot-bg:rgba(154,154,154,.16); --rot-tx:#5a5a5a;
  --wk:rgba(26,90,150,.05);
  --stripe:rgba(0,0,0,.05);
  --tipbg:#22303c; --tiptx:#f4f6f8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117; --surface:#181b22; --surface2:#1f242e; --surface3:#151820;
    --border:#2a2e3a; --border2:#232733;
    --ink:#e8eaf0; --ink2:#a8b3c4; --ink3:#8a95a5;
    --accent:#3d8fd4; --accent-h:#5aa4de; --accent-l:rgba(61,143,212,.12); --teal-tx:#5fd3c4; --accent-solid:#2f6ea8;
    color-scheme:dark;
    --ok:#4ade9d; --ok-bg:rgba(16,185,129,.12); --warn:#f0c060; --warn-bg:rgba(245,158,11,.10); --bad:#f08c8c; --bad-bg:rgba(239,68,68,.12);
    --sh-sm:0 1px 3px rgba(0,0,0,.35); --sh-md:0 4px 14px rgba(0,0,0,.45); --sh-lg:0 14px 40px rgba(0,0,0,.55);
    --hosp-bg:rgba(46,139,122,.26); --hosp-tx:#6fd0b8;
    --cons-bg:rgba(61,151,212,.22); --cons-tx:#7cc0ee;
    --qno-bg:rgba(157,123,245,.22); --qno-tx:#bda5f8;
    --pru-bg:rgba(201,126,36,.22);  --pru-tx:#e5a659;
    --ges-bg:rgba(150,150,150,.18); --ges-tx:#a9a9a9;
    --tarde:#5fb0e8;
    --g-bg:#4f68e0; --gl-tx:#93a4f2;
    --sal-bg:rgba(204,68,68,.2); --sal-tx:#ee9090;
    --vac-bg:#b91c1c;
    --ld-bg:rgba(90,138,191,.25); --ld-tx:#93bce4;
    --for-bg:rgba(212,136,58,.22); --for-tx:#e8b073;
    --ant-bg:rgba(122,138,106,.24); --ant-tx:#a9bd96;
    --otr-bg:rgba(154,154,154,.2); --otr-tx:#a9a9a9;
    --rot-bg:rgba(154,154,154,.2); --rot-tx:#a9a9a9;
    --wk:rgba(61,143,212,.07);
    --stripe:rgba(255,255,255,.06);
    --tipbg:#e8eaf0; --tiptx:#22303c;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117; --surface:#181b22; --surface2:#1f242e; --surface3:#151820;
  --border:#2a2e3a; --border2:#232733;
  --ink:#e8eaf0; --ink2:#a8b3c4; --ink3:#8a95a5;
  --accent:#3d8fd4; --accent-h:#5aa4de; --accent-l:rgba(61,143,212,.12); --teal-tx:#5fd3c4; --accent-solid:#2f6ea8;
  color-scheme:dark;
  --ok:#4ade9d; --ok-bg:rgba(16,185,129,.12); --warn:#f0c060; --warn-bg:rgba(245,158,11,.10); --bad:#f08c8c; --bad-bg:rgba(239,68,68,.12);
  --sh-sm:0 1px 3px rgba(0,0,0,.35); --sh-md:0 4px 14px rgba(0,0,0,.45); --sh-lg:0 14px 40px rgba(0,0,0,.55);
  --hosp-bg:rgba(46,139,122,.26); --hosp-tx:#6fd0b8;
  --cons-bg:rgba(61,151,212,.22); --cons-tx:#7cc0ee;
  --qno-bg:rgba(157,123,245,.22); --qno-tx:#bda5f8;
  --pru-bg:rgba(201,126,36,.22);  --pru-tx:#e5a659;
  --ges-bg:rgba(150,150,150,.18); --ges-tx:#a9a9a9;
  --tarde:#5fb0e8;
  --g-bg:#4f68e0; --gl-tx:#93a4f2;
  --sal-bg:rgba(204,68,68,.2); --sal-tx:#ee9090;
  --vac-bg:#b91c1c;
  --ld-bg:rgba(90,138,191,.25); --ld-tx:#93bce4;
  --for-bg:rgba(212,136,58,.22); --for-tx:#e8b073;
  --ant-bg:rgba(122,138,106,.24); --ant-tx:#a9bd96;
  --otr-bg:rgba(154,154,154,.2); --otr-tx:#a9a9a9;
  --rot-bg:rgba(154,154,154,.2); --rot-tx:#a9a9a9;
  --wk:rgba(61,143,212,.07);
  --stripe:rgba(255,255,255,.06);
  --tipbg:#e8eaf0; --tiptx:#22303c;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
select,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.micro{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh-sm)}
.hidden{display:none !important}

/* atributo hidden siempre gana a display de autor; botones deshabilitados se ven deshabilitados */
[hidden]{display:none!important}
.btn:disabled,.btn-cta:disabled{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;box-shadow:none!important}

/* 02-topbar.css */
/* ============ TOPBAR ============ */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;padding:calc(15px + env(safe-area-inset-top)) calc(26px + env(safe-area-inset-right)) 15px calc(26px + env(safe-area-inset-left));
  background:color-mix(in srgb, var(--surface) 86%, transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}   /* nunca se encoge: el logo no se recorta */
.brand>svg,.brand .coop{flex:none}
.bname{font-family:var(--font-d);font-size:24px;font-weight:700;letter-spacing:-.3px;color:var(--ink);white-space:nowrap}
.bname em{font-style:normal;color:var(--accent)}
/* El nombre del servicio acompaña a la marca: no compite con el menú ni se recorta.
   Iba a 15px con max-width:250px, que con el padding dejaba 236px de texto para
   los 237px que ocupa «Management Urología · HUCSC»: salía con puntos suspensivos
   en TODAS las pantallas, por un píxel. Ahora es un punto más pequeño (subtítulo,
   no segundo título), cabe entero y solo aparece cuando el menú tiene sitio. */
.svc{font-family:var(--font-d);font-size:14px;font-weight:600;color:var(--ink2);border-left:1px solid var(--border);padding-left:13px;margin-left:1px;white-space:nowrap;flex:none;letter-spacing:-.1px}
.tabs{display:flex;gap:2px;margin-left:auto;margin-right:auto;overflow-x:auto}
.tab{position:relative;background:none;border:0;padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--ink3);border-radius:8px;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink2)}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:2.5px;background:var(--accent);border-radius:2px}
@media (max-width:1560px){.svc{display:none}}
/* Nueve pestañas: con 14.5px se desbordaban y había que arrastrar el menú (y la marca
   se encogía hasta recortar el logo). La letra baja por tramos hasta que entran solas. */
@media (max-width:1700px){.tab{padding:9px 11px;font-size:13px}}
@media (max-width:1460px){.tab{padding:9px 9px;font-size:12.5px}.tab svg{display:none}}
@media (max-width:1280px){.tab{padding:9px 7px;font-size:12px}.tright{gap:6px}.topbar{gap:12px}}
@media (max-width:1120px){.tab{padding:9px 5px;font-size:11.5px}.tab[aria-selected="true"]::after{left:4px;right:4px}.topbar{gap:10px;padding-left:16px;padding-right:16px}.bname{font-size:21px}}
.tright{display:flex;align-items:center;gap:10px}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--ink2);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.iconbtn:hover{background:var(--accent-solid);border-color:var(--accent);color:#fff}
#topAvisos{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 2px 10px rgba(41,128,185,.35)}
#topAvisos:hover{filter:brightness(1.08);box-shadow:0 4px 14px rgba(41,128,185,.5);transform:translateY(-1px)}

main{max-width:1520px;margin:0 auto;padding:24px 26px 70px}
.view{animation:viewIn .3s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 03-nav.css */
/* ============ NAV ============ */
.tab svg{width:17px;height:17px;vertical-align:-3px;margin-right:5px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dnav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.dkick{display:block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;margin-bottom:2px}
.dbig{font-family:var(--font-d);font-size:42px;font-weight:300;letter-spacing:-.5px;color:var(--accent);line-height:1.1}
.dbig b{font-weight:700}
.dbig small{font-size:15px;color:var(--ink3);font-weight:500;margin-left:6px}
.dstats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dstat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 17px;font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;box-shadow:var(--sh-sm)}
.dstat b{font-family:var(--mono);font-size:17px;color:var(--ink);font-weight:700}
.dstat.ok b{color:var(--ok)} .dstat.warn b{color:var(--warn)} .dstat.sal b{color:var(--sal-tx)}
/* bloques de persona — grandes, con el color de cada uno */
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1;align-items:center;min-width:0}
.pchip{display:inline-flex;align-items:center;gap:10px;background:color-mix(in srgb, var(--pc) 11%, var(--surface));border:1px solid color-mix(in srgb, var(--pc) 32%, var(--border));border-left:5px solid var(--pc);border-radius:13px;padding:8px 14px 8px 9px;font-size:14.5px;font-weight:700;white-space:nowrap;transition:all .15s var(--ease);animation:chipIn .25s var(--ease)}
@keyframes chipIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.pchip:hover{box-shadow:0 3px 10px color-mix(in srgb, var(--pc) 30%, transparent);transform:translateY(-2px)}
.pchip .avq{flex:none;width:34px;height:34px;border-radius:10px;background:var(--pc);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.pchip i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink3);font-weight:700;margin-left:2px}
.rmx{border:0;background:none;color:var(--ink3);font-size:16px;padding:0 2px;line-height:1;border-radius:5px;opacity:.5}
.pchip:hover .rmx{opacity:1}
.rmx:hover{color:var(--bad)}
.addchip{display:inline-flex;align-items:center;gap:9px;border:2px dashed var(--border);background:none;border-radius:13px;padding:11px 18px;font-size:13.5px;font-weight:700;color:var(--ink3);transition:all .15s;min-height:50px}
.addchip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.addchip .capn{font-family:var(--mono);font-size:10.5px;font-weight:700;opacity:.8}
/* avatares cuadrados redondeados en toda la app */
.av{border-radius:9px}
.slotrow.vacia{background:color-mix(in srgb, var(--warn-bg) 60%, transparent)}
.slotrow.vacia .addchip{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.addchip.sust{border-style:solid;border-color:var(--accent);color:var(--accent-solid,var(--accent));background:none;padding:11px 14px}
.addchip.sust:hover{background:var(--accent-l)}
.popb.rec{border-color:var(--accent);color:var(--accent-solid,var(--accent));text-align:left}
.popb small{display:block;font-weight:600;font-size:11px;color:var(--ink3);margin-top:2px}
.slotrow.grow{background:color-mix(in srgb, var(--g-bg) 5%, transparent)}
.slotrow.grow:hover{background:color-mix(in srgb, var(--g-bg) 9%, transparent)}
.sechd{position:relative}
.sechd .prog{position:absolute;left:0;bottom:-1px;height:2.5px;background:var(--grad);border-radius:2px;transition:width .4s var(--ease)}
.addchip.xtra{border-color:color-mix(in srgb, var(--warn) 55%, transparent);color:var(--warn)}
.addchip.xtra:hover{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.popchk{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--ink2);margin:7px 0;font-weight:600;line-height:1.4;cursor:pointer}
.popchk input{accent-color:var(--accent);margin-top:2px}
.singchk{display:flex;gap:7px;align-items:center;font-size:10.5px;color:var(--ink2);font-weight:600;margin:0 0 8px;cursor:pointer}
.singchk input{accent-color:var(--accent)}
/* selector visual de personas */
.picker{width:330px;padding:14px 10px 10px}
.picker .ph,.picker .pd{padding:0 8px}
.plist{max-height:330px;overflow-y:auto;margin-top:6px}
.pgroup{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.14em;color:var(--ink3);padding:8px 8px 4px}
.prowp{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--ink);text-align:left;transition:background .12s}
.prowp:hover:not(:disabled){background:var(--accent-l)}
.plan tr.prow:hover td{background:var(--accent-l)}
.prowp:disabled{opacity:.45;cursor:default}
.prowp .av{width:32px;height:32px;font-size:11px}
.prowp .pn2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prowp .pn2 i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--ink3);margin-left:4px}
.prowp small{font-size:9.5px;color:var(--warn);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.colorset{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.colsw{width:26px;height:26px;border-radius:8px;background:var(--pc);border:2px solid transparent;cursor:pointer;position:relative;transition:transform .12s}
.colsw:hover{transform:scale(1.12)}
.colsw.on{outline:2.5px solid var(--ink);outline-offset:2px}
.colsw.usado::after{content:'';position:absolute;right:4px;bottom:4px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.95}
.mini{font-family:var(--mono);font-size:8px;font-weight:700;border-radius:4px;padding:1px 5px;background:var(--surface2);color:var(--ink2);margin-right:3px}
.arrows{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:4px;box-shadow:var(--sh-sm)}
.mbtn{width:38px;height:38px;border-radius:9px;border:0;background:none;color:var(--ink2);font-size:19px;font-weight:700}
.mbtn:hover:not(:disabled){background:var(--surface2)}
.mbtn:disabled{opacity:.25;cursor:default}
.dtitle{font-family:var(--font-d);font-size:20px;font-weight:700;letter-spacing:-.4px}
.dtitle small{font-size:13px;font-weight:600;color:var(--ink3);margin-left:6px}
.dchip{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;border-radius:6px;padding:3px 9px}
.dc-hoy{background:var(--accent-l);color:var(--accent)}
.dc-finde{background:var(--surface2);color:var(--ink2)}
.btn{border:0;border-radius:12px;font-size:14px;font-weight:700;padding:13px 20px;display:inline-flex;align-items:center;gap:8px;transition:all .18s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-sec{background:var(--surface);border:1px solid var(--border);color:var(--ink2)}
.btn-sec:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:none;border:0;color:var(--ink3);font-weight:600}
.btn-ghost:hover{color:var(--bad)}
.spacer{flex:1}
.mlabel{font-family:var(--font-d);font-size:17px;font-weight:700;min-width:150px;text-align:center;letter-spacing:-.2px}

#pubBtn.off{border-color:var(--warn);color:var(--warn)}
#pubBtn:disabled{opacity:.7;cursor:default}

/* 04-dia.css */
/* ============ DÍA ============ */
/* minmax(0,1fr): «1fr» no baja del contenido mínimo y a 320 px la tarjeta «Salientes de hoy» ensanchaba toda la columna 54 px fuera de pantalla (v2.35.0) */
.daygrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:980px){.daygrid{grid-template-columns:minmax(0,1fr)}}
.secblock{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh-sm);margin-bottom:14px;overflow:hidden}
.sechd{display:flex;align-items:center;gap:11px;padding:14px 20px;border-bottom:1px solid var(--border2);font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.sechd .dot{width:12px;height:12px;border-radius:4px}
.sechd .hint{margin-left:auto;letter-spacing:0;text-transform:none;font-family:var(--font);font-weight:500;font-size:12.5px;color:var(--ink3)}
.slotrow{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--border2)}
.slotrow:last-child{border-bottom:0}
.slotrow:hover{background:var(--surface3)}
.slbl{flex:0 0 265px;min-width:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.slbl .sala{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink3);background:var(--surface2);border-radius:4px;padding:1px 5px}
.slbl .varinfo{font-size:10px;color:var(--warn)}
.selwrap{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center}
.psel{min-width:170px;flex:1;max-width:230px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12px;padding:6px 8px}
.psel.filled{border-color:color-mix(in srgb, var(--accent) 40%, var(--border));background:var(--accent-l)}
.salnote{font-size:12.5px;color:var(--sal-tx);font-weight:600;white-space:nowrap}
.closebtn{border:0;background:none;color:var(--ink3);font-size:14px;padding:4px 7px;border-radius:7px;opacity:0;transition:opacity .15s}
.slotrow:hover .closebtn{opacity:1}
.closebtn:hover{background:var(--bad-bg);color:var(--bad)}
.cerrados{padding:12px 20px;font-size:13px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--border)}
.reopen{border:1px dashed var(--border);background:none;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink3);padding:6px 13px}
.reopen:hover{color:var(--accent);border-color:var(--accent)}
.nolab{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:24px;text-align:center;color:var(--ink2);font-size:13px;margin-bottom:14px}
.nolab b{display:block;font-family:var(--font-d);font-size:18px;color:var(--ink);margin-bottom:3px}
/* lateral */
.side{display:flex;flex-direction:column;gap:12px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:17px 20px;box-shadow:var(--sh-sm)}
.scard .lst{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.srow{display:flex;align-items:center;gap:10px;font-size:14px}
.srow .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow small{color:var(--ink3);font-size:10.5px;margin-left:auto;white-space:nowrap}
.szero{font-size:13px;color:var(--ink3);margin-top:6px}
.abschip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:6px;padding:2.5px 8px}
.a-VAC{background:var(--vac-bg);color:var(--vac-tx)} .a-LD{background:var(--ld-bg);color:var(--ld-tx)}
.a-FOR{background:var(--for-bg);color:var(--for-tx)} .a-ANT{background:var(--ant-bg);color:var(--ant-tx)}
.a-OTRO{background:var(--otr-bg);color:var(--otr-tx)} .a-ROT{background:var(--rot-bg);color:var(--rot-tx)}
.a-BAJ{background:var(--bad-bg);color:var(--bad)}
.a-SAL{background:var(--sal-bg);color:var(--sal-tx)}
.warnbanner{background:var(--warn-bg);border:1px solid color-mix(in srgb, var(--warn) 25%, transparent);border-radius:13px;padding:13px 18px;font-size:13.5px;color:var(--warn);margin-bottom:14px}
.warnbanner b{display:block;margin-bottom:3px}
/* guía de primeros pasos */
.guia{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:15px;padding:14px 40px 14px 20px;margin-bottom:18px;font-size:14px;color:var(--ink2);position:relative;box-shadow:var(--sh-sm)}
.gstep{display:inline-flex;align-items:center;gap:10px;font-weight:600}
.gstep b{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.gstep i{font-style:normal;color:var(--accent);font-weight:800}
.garrow{color:var(--ink3);font-weight:700;font-size:16px}
.glink{border:0;background:none;color:var(--accent);font-weight:800;font-size:inherit;text-decoration:underline;padding:0;cursor:pointer}
.gclose{position:absolute;top:10px;right:12px;border:0;background:none;color:var(--ink3);font-size:17px;cursor:pointer}
.gclose:hover{color:var(--bad)}

/* 06-mes.css */
/* ============ MES ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px}
.knum{font-family:var(--mono);font-size:21px;font-weight:700;margin:2px 0 0;font-variant-numeric:tabular-nums}
.kcap{font-size:11px;color:var(--ink3)}
.kpi.k-warn .knum{color:var(--warn)} .kpi.k-ok .knum{color:var(--ok)}
html,body{overflow-x:clip}
.tablewrap{overflow:hidden;margin-bottom:14px}
.tscroll{overflow:auto;scrollbar-width:thin;max-height:calc(100dvh - 150px)}
:root{--w-nombre:175px;--w-dia:62px}   /* anchos de la rejilla del mes: el JS los lee para el ancho total de la tabla */
table.plan{border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
.plan th.day{width:var(--w-dia)}
.plan th.pname{width:var(--w-nombre)}
.plan th{background:var(--surface2);font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:7px 2px;position:sticky;top:0;z-index:5}
.plan th.day{min-width:56px;text-align:center}
.plan th.day .dn{display:block;font-size:8.5px}
.plan th.day .dd{display:block;font-family:var(--mono);font-size:15.5px;font-weight:700;color:var(--ink2)}
.plan th.day.wk{background:color-mix(in srgb, var(--surface2) 60%, var(--wk))}
.plan th.day.wk .dd{color:var(--accent)}
.plan td{padding:6px 3px;border-bottom:1px solid var(--border2);text-align:center;position:relative}
.plan td.wk{background:var(--wk)}
.plan td[data-asig]{cursor:pointer}
.plan td[data-asig]:hover{box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:8px}
.plan tr.prowp:hover td{background:color-mix(in srgb, var(--accent-l) 60%, transparent)}
td.pname,th.pname{position:sticky;left:0;z-index:6;background:var(--surface);text-align:left;min-width:var(--w-nombre);max-width:var(--w-nombre);padding:4px 10px;border-right:1px solid var(--border)}
th.pname{top:0;z-index:8}
.plan th{box-shadow:0 1px 0 var(--border)}
.pn b{font-size:13.5px;font-weight:600;display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn small{font-size:9.5px;color:var(--ink3)}
tr.ghdr td{background:var(--surface2) !important;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--ink2);text-align:left;padding:6px 12px}
/* la fila del local ocupa todo el ancho: lo que se queda anclado al desplazar de lado
   es el nombre de dentro, no la celda (que empieza en 0 y no tiene a dónde moverse) */
tr.ghdr .ghl{display:inline-flex;align-items:center;position:sticky;left:12px}
tr.frow td{background:var(--surface3);border-top:1px solid var(--border);padding:4px 2px}
tr.frow td.pname{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);background:var(--surface3)}
.cwarn{display:inline-block;min-width:20px;border-radius:5px;background:var(--warn-bg);color:var(--warn);font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 4px}
.cok{color:var(--ok);font-weight:800;font-size:11px}
.cmut{color:var(--ink3);opacity:.4}
.pill.vacio{background:transparent;border:1.5px dashed var(--border);opacity:.6}
.pill.vacio:hover{transform:none;box-shadow:none}
.pill{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:50px;height:32px;border-radius:9px;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:0 4px;border:0;font-family:var(--mono)}
.k-hosp{background:var(--hosp-bg);color:var(--hosp-tx)} .k-cons{background:var(--cons-bg);color:var(--cons-tx)}
.k-qno{background:var(--qno-bg);color:var(--qno-tx)} .k-pru{background:var(--pru-bg);color:var(--pru-tx)}
.k-ges{background:var(--ges-bg);color:var(--ges-tx)}
.p-S{background:var(--sal-bg);color:var(--sal-tx);font-size:10.5px}
.p-G{background:var(--g-bg);color:var(--g-tx)}
.p-GL{background:transparent;color:var(--gl-tx);border:1.5px dashed var(--gl-tx)}
.striped{background-image:repeating-linear-gradient(45deg,transparent 0 3px,var(--stripe) 3px 6px)}
.pill.tarde::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--tarde) transparent transparent;border-top-right-radius:6px}
.gb{position:absolute;top:-7px;right:-8px;min-width:18px;height:14px;border-radius:7px;background:var(--g-bg);color:#fff;font-size:7px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--surface);z-index:2;padding:0 2px;font-family:var(--mono)}
.gb.gl{background:var(--surface);color:var(--gl-tx);border:1.3px dashed var(--gl-tx)}
.pill.conf{box-shadow:0 0 0 1.5px var(--bad)}
.legendbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 14px;margin-bottom:14px;font-size:11px;color:var(--ink2)}
.lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lgd{min-width:26px;height:17px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:800;font-family:var(--mono);padding:0 3px}

/* conflicto: además del aro rojo, un signo (daltonismo, lector de pantalla) */
.cmk{position:absolute;top:-5px;left:-4px;width:13px;height:13px;border-radius:50%;background:var(--bad);color:#fff;font-size:9px;font-weight:900;line-height:13px;text-align:center;font-style:normal}

/* 07-equipo.css */
/* ============ EQUIPO ============ */
.provbanner{background:var(--accent-l);border:1px solid color-mix(in srgb, var(--accent) 25%, transparent);border-radius:12px;padding:11px 16px;font-size:12.5px;color:var(--accent);margin-bottom:16px}
.sechdr{display:flex;align-items:center;gap:12px;margin:20px 0 12px}
.sechdr h2{font-family:var(--font-d);font-size:17px;font-weight:700;letter-spacing:-.2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;transition:all .2s var(--ease)}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.pchead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pchead b{font-size:13px;display:block;line-height:1.2}
.pchead small{font-size:10.5px;color:var(--ink3)}
.pstats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.ps{font-family:var(--mono);font-size:9px;font-weight:700;border-radius:5px;padding:2px 7px;background:var(--surface2);color:var(--ink2)}
.abschips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:4px}
.abschips .abschip button{border:0;background:none;color:inherit;font-size:11px;opacity:.6;padding:0}
.addabs{background:none;border:1px dashed var(--border);color:var(--ink3);border-radius:8px;font-size:11px;font-weight:600;padding:5px 10px;width:100%}
.addabs:hover{color:var(--accent);border-color:var(--accent)}
.absform{margin-top:8px;display:grid;gap:6px;background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:10px}
.absform label{font-size:9.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.absform select,.absform input{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12px;padding:6px 8px}
.absform .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.absform .bar{display:flex;gap:6px;justify-content:flex-end}
.btn-mini{border:0;border-radius:8px;font-size:11px;font-weight:700;padding:7px 12px;background:var(--accent-solid);color:#fff}
.btn-mini.ghost{background:var(--surface2);color:var(--ink2)}
.rmbtn{margin-top:5px;background:none;border:0;color:var(--ink3);font-size:10px;font-weight:600;text-align:right;width:100%}
.rmbtn:hover{color:var(--bad)}
.addcard{border:1.5px dashed var(--border);border-radius:14px;display:flex;flex-direction:column;gap:8px;padding:16px}
.addcard p{font-size:11.5px;color:var(--ink3);text-align:center}
.addcard input,.addcard select{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12px;padding:8px 10px}
/* alta y baja de personas: la barra de Equipo y la lista del diálogo */
.gestbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0 4px;padding:14px 16px;border:1.5px dashed var(--border);border-radius:14px;background:var(--surface3)}
.gestx{flex:1;min-width:220px}
.gestx b{display:block;font-size:13px}
.gestx small{font-size:11px;color:var(--ink3)}
.perslist{max-height:44vh;overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.persgrp{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:9px 12px 5px;background:var(--surface3);position:sticky;top:0}
.persrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--border2)}
.persnm{flex:1;min-width:0}
.persnm b{display:block;font-size:12.5px;line-height:1.25}
.persnm small{font-size:10.5px;color:var(--ink3)}
.persdel{color:var(--bad)}
.persdel:hover{background:var(--bad);color:#fff}

/* 08-popover-overlay-reparto.css */
/* ============ POPOVER + OVERLAY (reparto) ============ */
.pop{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-lg);width:310px;padding:16px 18px;animation:popIn .2s var(--ease)}
.pop .ph{font-size:15px;font-weight:700;margin-bottom:2px}
.pop .pd{font-size:12.5px;color:var(--ink2);margin-bottom:10px;line-height:1.5}
.popb{border:1px solid var(--border);background:var(--surface3);border-radius:10px;font-size:13px;font-weight:700;padding:11px 12px;color:var(--ink2);width:100%;margin-top:6px;transition:all .15s}
.popb:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn-cta{background:var(--grad);color:#fff;font-weight:800;box-shadow:0 6px 18px rgba(41,128,185,.28);border:0}
.btn-cta:hover{transform:translateY(-1px);filter:brightness(1.06)}
.ovl{position:fixed;inset:0;z-index:150;background:rgba(20,26,32,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ovcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh-lg);max-width:430px;width:100%;padding:28px 30px;position:relative;overflow:hidden;text-align:center;animation:popIn .3s var(--ease)}
.ovcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.ring{position:relative;width:76px;height:76px;margin:4px auto 16px}
.ring::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,#4ecdc4,#2980b9,transparent 65%);-webkit-mask:radial-gradient(circle,transparent 0 calc(50% - 3.5px),#000 calc(50% - 2.5px));mask:radial-gradient(circle,transparent 0 calc(50% - 3.5px),#000 calc(50% - 2.5px));animation:spin 1.1s linear infinite}
.ring svg{position:absolute;inset:0;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.slog{font-family:var(--mono);font-size:11px;text-align:left;color:var(--ink2);display:flex;flex-direction:column;gap:7px;min-height:76px;margin-bottom:6px}
.slog div{opacity:0;transform:translateY(4px);transition:all .3s var(--ease)}
.slog div.on{opacity:1;transform:none}
.slog .done{color:var(--ok);font-weight:700}
.ic{vertical-align:-2.5px;margin-right:2px;flex:none}
.pmini{flex:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink3);display:grid;place-items:center;cursor:pointer;transition:color .12s,border-color .12s}
.pmini:hover{color:var(--accent);border-color:var(--accent)}
.lvl{margin-left:auto;flex:none;font-family:var(--mono);font-size:10px;font-weight:800;background:var(--teal-bg,rgba(78,205,196,.16));color:var(--teal-tx);border-radius:7px;padding:3px 7px}
.traits{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;border-radius:8px;padding:3.5px 8px;background:var(--surface3);border:1px solid var(--border2);color:var(--ink2);max-width:100%}
.tchip b{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:800;flex:none}
.tchip i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip.fix{background:var(--accent-l);border-color:transparent;color:var(--accent)} .tchip.fix b{color:var(--accent);opacity:.75}
.tchip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)} .tchip.warn b{color:var(--warn);opacity:.8}
.tchip.teal{background:color-mix(in srgb,var(--teal) 14%,transparent);border-color:transparent;color:var(--teal)} .tchip.teal b{color:var(--teal);opacity:.85}
.dowset{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dowk{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink2);font-weight:800;font-size:11.5px;cursor:pointer;transition:all .12s}
.dowk:hover{border-color:var(--teal)}
.dowk.on{background:var(--teal);border-color:var(--teal);color:#fff}
.pmore{margin:2px 0 8px}
.pmore summary{cursor:pointer;list-style:none;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--surface3);border:1px solid var(--border2);border-radius:9px;padding:6px 10px;transition:background .12s}
.pmore summary:hover{background:var(--accent-l)}
.pmore summary::before{content:"▸ ";font-size:9px}
.pmore[open] summary::before{content:"▾ "}
.pmore>*:not(summary){margin-top:8px}
.wsteps{display:flex;align-items:center;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.wstep{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--ink3)}
.wstep i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:var(--surface3);border:1.5px solid var(--border);color:var(--ink3)}
.wstep.on{color:var(--ink)} .wstep.on i{background:var(--grad);border:0;color:#fff}

.rcp{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
.rcp .av{width:22px;height:22px;font-size:8px}
.rcp.on{border-color:var(--accent);background:var(--accent-l);box-shadow:inset 0 0 0 1px var(--accent)}
.cargaw u{position:absolute;left:calc(100% + 6px);top:-4.5px;font-size:8.5px;font-family:var(--mono);font-weight:800;color:var(--ink3);text-decoration:none;white-space:nowrap}
.btn .ic{margin-right:4px}
.micro .ic{vertical-align:-3px}
:root{--ease2:cubic-bezier(.16,1,.3,1)}
/* alianza Shiftia · Hospital: barrita minimal entre ambas marcas */
.coop{width:1.5px;height:22px;background:var(--border);border-radius:1px;margin:0 6px 0 11px;flex:none}
.hlogo{flex:none;border-radius:6px;box-shadow:var(--sh-sm)}
.hlogo{animation:hfade 1.1s var(--ease2) both}
@keyframes hfade{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.lockcoop{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.lockcoop .coop{height:20px;margin:0}
/* foco visible premium (teclado) */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
/* entradas escalonadas al cambiar de vista */
.view.stagger>*{animation:riseIn .38s var(--ease2) both}
.view.stagger>*:nth-child(1){animation-delay:0ms}.view.stagger>*:nth-child(2){animation-delay:45ms}
.view.stagger>*:nth-child(3){animation-delay:90ms}.view.stagger>*:nth-child(4){animation-delay:135ms}
.view.stagger>*:nth-child(5){animation-delay:180ms}.view.stagger>*:nth-child(n+6){animation-delay:210ms}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* botones: pulsación y brillo sutil del CTA */
.btn,.iconbtn,.mbtn,.cobap,.revgo,.popb,.addchip{transition:transform .15s var(--ease2),box-shadow .15s var(--ease2),background .15s,border-color .15s}
.btn:active,.iconbtn:active,.mbtn:active,.cobap:active,.revgo:active,.addchip:active{transform:scale(.965)}
.btn-cta{position:relative;overflow:hidden}
.btn-cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.34) 50%,transparent 58%);transform:translateX(-120%);transition:none;pointer-events:none}
.btn-cta:hover::after{transform:translateX(120%);transition:transform .55s var(--ease2)}
/* topbar y barra pegajosa con efecto cristal */
.topbar{backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.dsticky{backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
/* overlays: entrada calmada según sistema */
.ovcard{animation:modalIn .3s var(--ease2)}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
/* tarjetas interactivas: elevación al pasar */
.pcard{transition:transform .2s var(--ease2),box-shadow .2s var(--ease2)}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.kpi{transition:transform .2s var(--ease2),box-shadow .2s var(--ease2)}
/* logo: trazo que se dibuja al cargar (una vez) */
.brand svg path{stroke-dasharray:70;stroke-dashoffset:0;animation:logodraw 1.1s var(--ease2) both}
@keyframes logodraw{from{stroke-dashoffset:70}to{stroke-dashoffset:0}}
/* toasts con icono y entrada lateral */
.toast{display:flex;align-items:flex-start;gap:9px;animation:toastIn .32s var(--ease2)}
.toast .tico{flex:none;margin-top:1px}
.toast.ok .tico{color:#27ae60}.toast.warn .tico{color:#d4883a}.toast.bad .tico{color:#cc4444}.toast .tico{color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
/* transición suave al cambiar de tema */
html.themeing, html.themeing *{transition:background-color .32s var(--ease2),color .32s var(--ease2),border-color .32s var(--ease2) !important}
.pill{transition:transform .14s var(--ease),box-shadow .14s}
.pill:hover{transform:scale(1.14) translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.16);z-index:4;position:relative}
/* menú de ausencias desde el visor Mes: los códigos de la leyenda del cuadrante */
.austipos{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.austipo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border:1px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer;transition:all .14s var(--ease2)}
.austipo b{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--ink2);letter-spacing:.02em}
.austipo i{font-style:normal;font-size:8.5px;color:var(--ink3);text-align:center;line-height:1.15}
.austipo:hover{border-color:var(--accent);background:var(--accent-l)}
.austipo.on{border-color:var(--accent);background:var(--accent-l);box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent)}
.austipo.on b{color:var(--accent)}
#ausPop{width:288px}
#ausPop input[type=date],#ausPop input[type=text]{box-sizing:border-box;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface3);color:var(--ink);font-size:12px}
#ausPop .row2{display:flex;gap:6px}
#ausPop .row2 span{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#ausPop label{font-size:9px;font-family:var(--mono);font-weight:800;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
#ausPop .popb.full{margin-top:9px}
#ausPop .popb.full[disabled]{opacity:.5;cursor:default}
/* aviso de versión nueva: abajo, sin tapar la navegación inferior del móvil */
.updbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:700;display:flex;align-items:center;gap:11px;max-width:min(560px,calc(100vw - 24px));padding:11px 12px 11px 14px;border-radius:15px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-lg);transition:transform .38s var(--ease2),opacity .3s;opacity:0}
.updbar.on{transform:translate(-50%,0);opacity:1}
.updbar::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:15px 15px 0 0;background:var(--grad)}
.updic{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent-l);color:var(--accent)}
.updtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.updtx b{font-size:12.5px;font-weight:800;color:var(--ink)}
.updtx small{font-size:10.5px;color:var(--ink3);font-weight:600}
.updb{flex:none;border:0;background:var(--grad);color:#fff;border-radius:10px;font-size:12px;font-weight:800;padding:9px 15px;cursor:pointer;transition:filter .15s,transform .15s var(--ease2)}
.updb:hover{filter:brightness(1.08)}
.updb:active{transform:scale(.965)}
.updb[disabled]{opacity:.7;cursor:default}
.updx{flex:none;border:0;background:none;color:var(--ink3);font-size:14px;cursor:pointer;padding:4px 6px;border-radius:7px;line-height:1}
.updx:hover{background:var(--surface3);color:var(--ink)}
/* 640, no 620: es donde nace la barra inferior; entre 621 y 640 el aviso se le ponía encima */
@media (max-width:640px), ((max-height:520px) and (pointer:coarse)){.updbar{bottom:calc(74px + env(safe-area-inset-bottom));flex-wrap:wrap}.updtx{flex-basis:100%;order:-1}}
/* versión instalada, en Cuenta: para no tener que adivinar qué está corriendo */
.vercaja{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface3)}
.verl{font-size:9px;font-family:var(--mono);font-weight:800;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.verv{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink2)}
.verestado{font-size:10.5px;font-weight:700;color:var(--ink3)}
.verestado.bien{color:var(--ok)}
.verestado.nueva{color:var(--accent)}
.verestado.mal{color:var(--bad)}

/* 09-ficha-de-persona-revision-recomend.css */
/* ============ FICHA DE PERSONA · REVISIÓN · RECOMENDADOS · BARRA DEL DÍA ============ */
.pchip[data-pid]{cursor:pointer}
.pchip[data-pid]:hover{box-shadow:0 3px 12px rgba(0,0,0,.14)}
.pn[data-ficha]:hover b,.pchead[data-ficha]:hover b{color:var(--accent)}
.ovcard.big{max-width:660px;text-align:left;max-height:88vh;overflow:auto;padding:24px 26px}
.ovx{position:absolute;top:12px;right:14px;border:0;background:var(--surface2);color:var(--ink2);width:30px;height:30px;border-radius:9px;font-size:14px;cursor:pointer;z-index:2}
.ovx:hover{background:var(--surface3);color:var(--ink)}
.fichead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.fichav{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;font-family:var(--font-d);box-shadow:var(--sh-md);flex:none}
.fichead h2{font-family:var(--font-d);font-size:21px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.fichead .sub{font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:3px;display:block}
.ficbadges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ficb{font-size:10px;font-weight:700;font-family:var(--mono);letter-spacing:.04em;border-radius:7px;padding:3px 8px;background:var(--accent-l);color:var(--accent)}
.ficb.warn{background:var(--warn-bg);color:var(--warn)}
.ficstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:12px 0}
.fics{background:var(--surface3);border:1px solid var(--border2);border-radius:11px;padding:9px 11px}
.fics b{font-size:19px;font-family:var(--font-d);display:block;line-height:1.15}
.fics>span{font-size:9px;font-family:var(--mono);letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;font-weight:700}
.fics small{display:block;font-size:11px;color:var(--ink3);margin-top:2px;font-weight:600}
.fics small.up{color:var(--warn)} .fics small.dn{color:var(--ok)}
.ficcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.ficdh{font-size:11px;font-family:var(--mono);color:var(--ink3);text-align:center;font-weight:700;padding:2px 0}
.ficd{min-height:42px;border-radius:8px;background:var(--surface3);border:1px solid var(--border2);padding:3px 5px;font-family:var(--mono);cursor:pointer;transition:transform .12s var(--ease),box-shadow .12s}
.ficd:hover{transform:scale(1.08);box-shadow:var(--sh-md);z-index:2;position:relative}
.ficd .n{font-size:9.5px;color:var(--ink3);font-weight:700}
.ficd .c{display:block;font-weight:800;font-size:9px;margin-top:1px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficd.wk{background:var(--surface2);opacity:.7}
.ficd.f-man{background:var(--accent-l);border-color:transparent} .ficd.f-man .c{color:var(--accent)}
.ficd.f-g{background:var(--ink);border-color:transparent} .ficd.f-g .n,.ficd.f-g .c{color:var(--bg)}   /* sigue al tema: en oscuro #fff sobre --ink era blanco sobre blanco */
.ficd.f-s{background:rgba(78,205,196,.18);border-color:transparent} .ficd.f-s .c{color:var(--teal-tx)}
.ficd.f-aus{background:var(--warn-bg);border-color:transparent} .ficd.f-aus .c{color:var(--warn)}
.ficd.f-lib{background:repeating-linear-gradient(45deg,var(--surface2) 0 5px,var(--surface3) 5px 10px)}
.ficd.hoy{outline:2px solid var(--accent);outline-offset:1px}
.revh2{font-family:var(--font-d);font-size:20px;font-weight:700;letter-spacing:-.4px;margin:4px 0 2px}
.revsub{font-size:11.5px;color:var(--ink3);margin-bottom:10px}
.revgrp{font-size:10px;font-family:var(--mono);letter-spacing:.1em;font-weight:700;margin:14px 0 6px;display:flex;align-items:center;gap:7px}
.revgrp .dot{width:9px;height:9px;border-radius:50%}
.revitem{display:flex;gap:10px;align-items:center;padding:8px 11px;border:1px solid var(--border2);border-radius:10px;background:var(--surface3);font-size:12px;margin-bottom:5px;line-height:1.4;animation:popIn .25s var(--ease) both}
.revitem.alta{border-left:4px solid var(--bad)}
.revitem.media{border-left:4px solid var(--warn)}
.revitem.info{border-left:4px solid var(--accent)}
.revitem .msg{flex:1;min-width:0}
.revgo{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:10px;font-weight:700;padding:4px 9px;cursor:pointer;color:var(--accent);font-family:var(--mono)}
.revgo:hover{background:var(--accent-l)}
/* propuesta de arreglo: dice lo que haría antes de hacerlo */
.revfix{flex:none;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:var(--grad);color:#fff;border-radius:8px;font-size:10px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:var(--mono);transition:transform .15s var(--ease2),filter .15s}
.revfix:hover{filter:brightness(1.08)}
.revfix:active{transform:scale(.965)}
.revfix[disabled]{background:var(--ok);opacity:.85;cursor:default}
.revtodo{width:100%;margin:2px 0 12px;border:0;background:var(--grad);color:#fff;border-radius:11px;font-size:12.5px;font-weight:800;padding:11px;cursor:pointer;transition:filter .15s}
.revtodo:hover{filter:brightness(1.08)}
.revtodo small{font-weight:600;opacity:.9;font-size:10.5px;display:block;margin-top:2px}
.revok{text-align:center;padding:26px 10px}
.revok .big{font-size:38px;margin-bottom:8px;display:block}
.prowp.rec{background:linear-gradient(90deg,var(--accent-l),transparent 75%)}
.prowp .prsub{display:block;font-size:9.5px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{flex:none;font-size:8.5px;font-family:var(--mono);font-weight:800;letter-spacing:.05em;background:var(--grad);color:#fff;border-radius:6px;padding:2.5px 6px}
.dsticky{position:fixed;top:0;left:0;right:0;z-index:80;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--sh-md);display:flex;align-items:center;gap:10px;padding:8px 18px;transform:translateY(-100%);transition:transform .25s var(--ease)}
.dsticky.on{transform:none}
.dsticky b{font-family:var(--font-d);font-size:15px;letter-spacing:-.2px}
.dsticky .mini2{font-size:10.5px;color:var(--ink3);font-family:var(--mono);font-weight:700}
.dsticky .sp{flex:1}
/* botón de ausencia junto al nombre, en el cuadrante del mes */
.pnaus{float:right;margin-left:6px;flex:none;width:19px;height:19px;line-height:1;border:1px solid var(--border);background:var(--surface);color:var(--ink3);border-radius:6px;font-size:12px;font-weight:800;cursor:pointer;padding:0;transition:all .14s var(--ease2)}
.pnaus:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
/* bloque de acceso a la app en la ficha de Equipo */
.acceso{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:9px 0 4px;padding:9px 10px;border:1px dashed var(--border);border-radius:10px;background:var(--surface3)}
.accl{font-size:9px;font-family:var(--mono);font-weight:800;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase;width:100%}

/* 12-semana.css */
/* ============ SEMANA ============ */
.semt th{min-width:154px}
.semt th.fuera,.semt td.fuera{opacity:.35}
.fbdg{display:block;font-size:7px;color:var(--bad);font-weight:800}
.semt td{padding:7px 5px;vertical-align:middle}
.wcell{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;min-height:40px}
.wav{min-width:48px;height:36px;border-radius:10px;border:0;background:var(--pc);color:#fff;font-size:12px;font-weight:800;letter-spacing:.03em;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 1px 3px color-mix(in srgb, var(--pc) 45%, transparent);transition:transform .12s}
.wav:hover{transform:scale(1.18) translateY(-1px);box-shadow:0 4px 12px color-mix(in srgb, var(--pc) 55%, transparent)}
.wadd{min-width:40px;height:36px;border-radius:10px;border:2px dashed var(--border);background:none;color:var(--ink3);font-size:15px;line-height:1;padding:0 5px}
.wadd:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.wsust{min-width:34px;height:36px;border-radius:10px;border:1.5px solid var(--accent);background:none;color:var(--accent-solid,var(--accent));font-size:14px;line-height:1;padding:0 5px}
.wsust:hover{background:var(--accent-l)}
.semt td.hoyc{background:color-mix(in srgb, var(--accent-l) 80%, transparent) !important}
.semt th.hoyt{box-shadow:inset 0 -2.5px 0 var(--accent)}
.semt th.hoyt .dd{color:var(--accent)}
.wtg{width:38px;height:32px;border-radius:9px;border:2px dashed var(--border);background:none;color:var(--ink3);font-size:13px;opacity:.65}
.wtg:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.wacts{display:flex;gap:5px;margin-top:4px}
.wacts button{border:1px solid var(--border);background:none;border-radius:8px;font-size:10px;font-weight:700;color:var(--ink3);padding:4px 10px;font-family:var(--mono)}
.wacts button:hover{color:var(--accent);border-color:var(--accent)}
.evbdg{display:block;font-size:7px;color:var(--warn);font-weight:800;cursor:help}

/* 13-impresion-formato-del-excel.css */
/* ============ IMPRESIÓN ============ */
/* 07/09: los tres imprimibles con la paleta de la app: secciones del Excel (--sec-*),
   chips por categoría (--hosp-bg…), guardias azules, tardes ámbar, saliente y ausencias
   con su color, y el color de cada persona en su nombre. Fondos forzados al imprimir. */
#printRoot{position:fixed;inset:0;z-index:400;background:#eef0f2;color:#1a2a33;overflow:auto;padding:18px 22px;font-family:'Inter','DM Sans',Arial,Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pbar2{display:flex;gap:10px;align-items:center;margin:0 auto 12px;max-width:277mm}
.pbnota{font-size:11px;color:#5c6b75}
.pxpage{background:#fff;margin:0 auto;padding:12mm 12mm 10mm;width:210mm;min-height:280mm;box-shadow:0 2px 14px rgba(0,0,0,.12);border-radius:4px}
.pxpage.apaisado{width:297mm;min-height:200mm;padding:8mm 9mm}
/* cabecera común: marca Shiftia · logo HUCSC · título · dato de la derecha; regla degradada */
.pxhead{display:flex;align-items:center;gap:12px;padding-bottom:6px;margin-bottom:7px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#4ecdc4,#2980b9) 1}
.pxlogos{display:flex;align-items:center;gap:9px;flex:none}
.pxlogos svg{display:block;border-radius:8px}
.pxbar{width:1.5px;height:26px;background:#d5dde2}
.pxhucsc{width:34px;height:34px;object-fit:contain;display:block}
.pxtit{flex:1;min-width:0}
.pxtit b{display:block;font-size:19px;letter-spacing:-.3px;line-height:1.1;color:#1a2a33}
.pxtit small{display:block;font-size:9.5px;color:#5c6b75;margin-top:2px}
.pxder{text-align:right;flex:none;max-width:45%}
.pxder b{display:block;font-size:15px;color:#2980b9;line-height:1.1}
.pxder small{display:block;font-size:9px;color:#5c6b75;margin-top:2px}
.pxfoot{display:flex;justify-content:space-between;gap:10px;margin-top:7px;padding-top:5px;border-top:1px solid #e2e8ec;font-size:7.5px;color:#8a97a0}
.pxfoot span:nth-child(2){flex:1;text-align:center;color:#5c6b75}
/* nombre con el color de la persona y el año del residente */
.nm{display:flex;align-items:center;gap:4px;line-height:1.22;white-space:nowrap}
.nm i{flex:none;width:6px;height:6px;border-radius:50%;background:#8a97a0}
.nm small{font-size:7px;font-weight:700;color:#5c6b75;background:#eef2f5;border-radius:4px;padding:0 3px;margin-left:1px}
/* ---- semana ---- */
table.pxw{border-collapse:separate;border-spacing:0;width:100%;font-size:8.5px;border:1px solid #d9e0e6;border-radius:8px;overflow:hidden}
.pxw th,.pxw td{border-right:1px solid #e6ebef;border-bottom:1px solid #e6ebef;padding:1.5px 5px;vertical-align:top;text-align:left}
.pxw th:last-child,.pxw td:last-child{border-right:0}

/* 14-importador-aptitudes.css */
/* ============ IMPORTADOR + APTITUDES ============ */
.provbanner{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.provbanner .txt{flex:1;min-width:240px}
textarea.imp{width:100%;min-height:190px;border:1px solid var(--border);border-radius:10px;background:var(--surface3);color:var(--ink);font-family:var(--mono);font-size:12px;padding:12px;resize:vertical}
.aptbox{margin:2px 0 8px}
.aptbox summary{font-size:10.5px;color:var(--ink3);cursor:pointer;font-weight:600;list-style:none}
.aptbox summary::before{content:"▸ ";font-size:9px}
.aptbox[open] summary::before{content:"▾ "}
.aptbox summary b{color:var(--accent);font-weight:700}
.aptgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;padding:9px 10px;background:var(--surface3);border:1px solid var(--border2);border-radius:9px;margin-top:6px}
.aptchk{font-size:10.5px;display:flex;gap:6px;align-items:center;color:var(--ink2);font-weight:600}
.aptchk input{accent-color:var(--accent)}
.aptall{grid-column:1/-1;text-align:left}
/* tooltip / toast */
#tip{position:fixed;z-index:200;background:var(--tipbg);color:var(--tiptx);font-size:11.5px;line-height:1.45;border-radius:9px;padding:8px 11px;max-width:260px;pointer-events:none;box-shadow:var(--sh-md);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#toasts{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:11px;box-shadow:var(--sh-lg);padding:11px 16px;font-size:12.5px;font-weight:600;max-width:340px;animation:popIn .3s var(--ease)}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
.toast.ok{border-left-color:#27ae60} .toast.warn{border-left-color:#d4883a} .toast.bad{border-left-color:#cc4444}
footer{border-top:1px solid var(--border);padding:16px 22px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink3);font-size:11px;max-width:1360px;margin:0 auto}
footer .sep{flex:1}
